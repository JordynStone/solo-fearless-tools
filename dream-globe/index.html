<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solo & Fearless Dream Destinations</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Re-skinned 1 August 2026 to the Solo & Fearless language: the same
   Montserrat as the website and the platform, the lit teal from the login
   screen, pill buttons with their own glow, and surfaces that lift.
   Only the look changed. Every word and every interaction is untouched. */
:root{--teal:#2C5F5D;--teal-lit:#37716E;--gold:#D4A574;--gold-lit:#E0B98A;--cream:#F8F6F0;--coral:#E8A87C;--char:#3A3A3A;--line:#E5E0D5}
*{box-sizing:border-box;margin:0;padding:0}
/* The cream is never flat: gold and coral catch the corners, teal warms the
   bottom, the same scattered light as every other surface in the brand. */
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--char);min-height:100vh;line-height:1.4;
  background:
    radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%),
    radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%),
    radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%),
    var(--cream);
  background-attachment:fixed}
/* The real lit teal, the same light as the login screen and the diagnostic:
   gold falling in from the top left, green rising at the bottom right, over
   a deep teal that is never one flat colour. */
header{color:var(--cream);padding:18px 24px;text-align:center;position:relative;box-shadow:0 8px 22px rgba(44,95,93,0.32);
  background:
    radial-gradient(900px 400px at 15% -30%, rgba(212,165,116,0.32), rgba(212,165,116,0) 70%),
    radial-gradient(760px 380px at 88% 130%, rgba(63,163,122,0.26), rgba(63,163,122,0) 70%),
    linear-gradient(160deg, #1B403C 0%, #142E2C 58%, #0E211F 100%);
  z-index:1}
.admin-tg{position:absolute;top:50%;right:18px;transform:translateY(-50%);background:transparent;border:1px solid rgba(248,246,240,.25);color:var(--cream);opacity:.35;cursor:pointer;font-size:22px;width:28px;height:28px;border-radius:14px;padding:0;font-family:inherit;font-weight:bold;display:flex;align-items:center;justify-content:center;line-height:1}
.admin-tg:hover{opacity:.9;background:rgba(248,246,240,.1)}
header h1{font-size:22px;font-weight:700;letter-spacing:-0.01em}
header p{font-size:13px;opacity:.85;margin-top:4px}
/* The map contours the community has behind its cream, exactly as they are
   drawn there: barely-there teal and coral lines, the whole set at half
   strength, sitting behind everything and invisible to the mouse. */
.sf-contours{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0;opacity:.5}
/* The globe card is only ever as wide as the globe itself, so no empty white
   is left beside it. The pair is centred on the page instead of stretched. */
.app{display:grid;grid-template-columns:auto 320px;justify-content:center;gap:16px;padding:16px;max-width:1500px;margin:0 auto;position:relative;z-index:1}
/* Both panels are cards now: a gold rule on top and a teal-tinted lift. */
.left{width:min(calc(100vh - 230px),calc(100vw - 400px));align-self:start;background:#fff;border-radius:16px;border-top:3px solid var(--gold);overflow:hidden;box-shadow:0 10px 30px rgba(44,95,93,.09)}
.admin{display:none;padding:14px 16px;gap:10px;align-items:flex-end;flex-wrap:wrap;
  background:
    radial-gradient(700px 320px at 12% -40%, rgba(212,165,116,0.30), rgba(212,165,116,0) 70%),
    radial-gradient(600px 300px at 90% 140%, rgba(63,163,122,0.24), rgba(63,163,122,0) 70%),
    linear-gradient(160deg, #1B403C 0%, #142E2C 58%, #0E211F 100%)}
.admin.show{display:flex}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px;position:relative}
.field label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--cream);opacity:.85;font-weight:600}
/* Fields: white, softly sunk, with the gold ring when she is typing in them. */
.field input{background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:12px;color:var(--char);font-size:14px;font-family:inherit;width:100%;box-shadow:inset 0 2px 4px rgba(44,95,93,.07)}
.field input:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 2px 4px rgba(44,95,93,.07),0 0 0 3px rgba(212,165,116,.18)}
.btn{border:none;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.btn-gold{background:linear-gradient(to bottom,var(--gold-lit),var(--gold));color:var(--char);box-shadow:0 8px 22px rgba(212,165,116,.45)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,165,116,.55)}
.btn-gold:active{transform:translateY(0)}
.btn-ghost{background:#fff;color:var(--teal);border:1px solid rgba(212,165,116,.55);box-shadow:0 8px 22px rgba(212,165,116,.30)}
.btn-ghost:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,165,116,.42)}
.btn-ghost:active{transform:translateY(0)}
.hint{font-size:11px;color:var(--cream);opacity:.65;padding:6px 2px 0;width:100%}
.gw{position:relative;background:radial-gradient(circle at 35% 30%,#0a2030 0%,#03080f 90%);aspect-ratio:1;width:100%}
svg.globe{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
svg.globe:active{cursor:grabbing}
.tt{position:absolute;background:rgba(58,58,58,.95);color:var(--cream);padding:9px 14px;border-radius:12px;font-size:13px;pointer-events:none;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .15s;z-index:50;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tt strong{color:var(--gold)}
.zc{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:6px}
/* The two zoom buttons sit on the dark globe, so they take the quiet
   outline: white, a gold edge and a gold glow of their own. */
.zc button{width:36px;height:36px;border-radius:999px;background:#fff;border:1px solid rgba(212,165,116,.55);color:var(--teal);font-size:20px;font-weight:bold;cursor:pointer;font-family:inherit;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 8px 22px rgba(212,165,116,.30);transition:transform .2s,box-shadow .2s}
.zc button:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,165,116,.42)}
.zc button:active{transform:translateY(0)}
.sb{background:#fff;border-radius:16px;border-top:3px solid var(--gold);padding:16px;box-shadow:0 10px 30px rgba(44,95,93,.09);max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
.stats{background:var(--cream);border-top:1px solid rgba(212,165,116,.4);padding:12px;border-radius:14px;margin-bottom:12px;text-align:center}
.stats .num{font-size:26px;font-weight:700;color:var(--teal);display:block;line-height:1.1}
.stats .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--char);opacity:.7;margin-top:2px;display:block}
/* The two tabs are the platform's segmented control: both lit, the chosen
   one carrying the teal gradient and its glow. */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:11px 8px;background:#fff;border:2px solid var(--line);border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;color:var(--char);font-family:inherit;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 10px 30px rgba(44,95,93,.09);transition:all .15s ease,transform .2s,box-shadow .2s}
.tab:hover{transform:translateY(-2px)}
.tab:active{transform:translateY(0)}
.tab.active{color:#fff;font-weight:700;border-color:var(--teal);background:linear-gradient(to bottom,var(--teal-lit),var(--teal));box-shadow:0 8px 22px rgba(44,95,93,.32)}
.list{flex:1;overflow-y:auto;padding-right:4px}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
/* Every row in the list is a card she can pick: it lifts, and the one she
   has picked takes the lit gold, the same gold as its pin on the globe. */
.item{padding:10px 14px;background:#fff;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px;box-shadow:0 10px 30px rgba(44,95,93,.09);transition:all .15s ease,transform .2s,box-shadow .2s}
.item:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(44,95,93,.14)}
.item:active{transform:translateY(0)}
.item.active{background:linear-gradient(to bottom,var(--gold-lit),var(--gold));border-color:var(--gold);color:var(--char);font-weight:700;box-shadow:0 8px 22px rgba(212,165,116,.45)}
.item span:first-child{overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--teal);color:var(--cream);font-size:11px;padding:2px 8px;border-radius:10px;min-width:22px;text-align:center;font-weight:600;flex-shrink:0}
.item.active .badge{background:var(--char);color:var(--cream)}
.sub{padding:10px 12px 10px 20px;background:#f9f7ef;border-top:1px solid rgba(212,165,116,.4);border-radius:14px;margin:-4px 0 8px}
/* The names inside an opened row are pressable too, so they are lit as well. */
.sub-i{font-size:13px;padding:7px 12px;margin-bottom:5px;cursor:pointer;color:var(--teal);background:#fff;border:1px solid var(--line);border-radius:999px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(44,95,93,.09);transition:transform .2s,box-shadow .2s}
.sub-i:last-child{margin-bottom:0}
.sub-i:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(44,95,93,.14)}
.sub-i:active{transform:translateY(0)}
.sub-i span:first-child:hover{text-decoration:underline}
.del{background:#fff;border:1px solid rgba(212,165,116,.55);color:#c25e5e;cursor:pointer;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;font-family:inherit;flex-shrink:0;box-shadow:0 8px 22px rgba(212,165,116,.30);transition:transform .2s,box-shadow .2s}
.del:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,165,116,.42)}
.del:active{transform:translateY(0)}
.community-btn{display:block;background:linear-gradient(to bottom,var(--gold-lit),var(--gold));color:var(--char);text-align:center;padding:14px;border-radius:999px;font-weight:700;text-decoration:none;font-size:14px;margin-top:12px;box-shadow:0 8px 22px rgba(212,165,116,.45);transition:transform .2s,box-shadow .2s;flex-shrink:0}
.community-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,165,116,.55)}
.community-btn:active{transform:translateY(0)}
.empty{color:#999;font-size:13px;padding:30px 16px;text-align:center;line-height:1.6}
.ac{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:12px;border-top:1px solid rgba(212,165,116,.4);box-shadow:0 10px 30px rgba(44,95,93,.18);max-height:220px;overflow-y:auto;z-index:100}
.ac-i{padding:9px 13px;cursor:pointer;color:var(--char);font-size:13px;font-weight:500;border-bottom:1px solid #f4f0e3;transition:background .15s}
.ac-i:last-child{border-bottom:none}
/* A suggestion she is about to pick takes the gold edge, the same as every
   option she picks in the diagnostic. Inset, so no text moves. */
.ac-i:hover,.ac-i.hv{background:var(--cream);box-shadow:inset 3px 0 0 var(--gold)}
.loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--cream);font-size:13px;opacity:.6}
@media (max-width:768px){.app{grid-template-columns:1fr;padding:8px;gap:8px}.left{width:100%}.admin{flex-direction:column;align-items:stretch}.field{min-width:0}.sb{max-height:60vh}}
</style>
</head>

<header>
  <h1>Solo & Fearless Dream Destinations</h1>
  <p>Dream destinations from our community</p>
  <button class="admin-tg" id="adminTg" aria-label="Admin access" title="Admin">·</button>
</header>

<div class="app">
  <div class="left">
    <div class="admin" id="admin">
      <div class="field">
        <label>Name</label>
        <input type="text" id="nameIn" autocomplete="off" maxlength="40">
      </div>
      <div class="field">
        <label>Destination</label>
        <input type="text" id="destIn" autocomplete="off" maxlength="60">
        <div class="ac" id="ac" style="display:none"></div>
      </div>
      <button class="btn btn-gold" id="addBtn">Add Pin</button>
      <button class="btn btn-ghost" id="expBtn">Export JSON</button>
      <button class="btn btn-ghost" id="impBtn">Import JSON</button>
      <input type="file" id="impFile" accept=".json" style="display:none">
      <div class="hint">Pick from the suggestions for accurate placement. Drag to spin, scroll to zoom.</div>
    </div>
    <div class="gw">
      <svg class="globe" id="svg" viewBox="0 0 600 600"></svg>
      <div class="tt" id="tt"></div>
      <div class="loader" id="loader">Loading globe...</div>
      <div class="zc">
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">−</button>
      </div>
    </div>
  </div>
  
  <div class="sb">
    <div class="stats">
      <span class="num" id="stat">0</span>
      <span class="lbl">dreams pinned</span>
    </div>
    <div class="tabs">
      <button class="tab active" data-t="top">Top Destinations</button>
      <button class="tab" data-t="dreamers">Dreamers</button>
    </div>
    <div class="list" id="list"></div>
    <a href="https://members.soloandfearless.com/community" class="community-btn">Return to the community</a>
  </div>
</div>

// Admin password - the password itself is no longer written here, only a
// fingerprint of it, so this public page cannot tell anyone what it is.
// The password you type is unchanged.
const ADMIN_SALT='solo-fearless-dream-globe';
const ADMIN_HASH='2c96f366f3f209918cd3db3bbd5474bceef029ee91653ecfe493ec56dbd08661';
async function passOk(p){
  try{
    const enc=new TextEncoder();
    const k=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(ADMIN_SALT),iterations:150000,hash:'SHA-256'},k,256);
    return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')===ADMIN_HASH;
  }catch(e){return false;}
}

const S={pins:[],selDream:null,selDest:null,tab:'top',rot:[-10,-25,0],sc:270,auto:true};
const W=600,H=600;
const svg=d3.select('#svg'),svgN=document.getElementById('svg'),tt=document.getElementById('tt'),wrap=svgN.parentElement;
const proj=d3.geoOrthographic().scale(S.sc).translate([W/2,H/2]).rotate(S.rot).clipAngle(90);
const pth=d3.geoPath(proj);

const defs=svg.append('defs');
const og=defs.append('radialGradient').attr('id','og').attr('cx','35%').attr('cy','30%').attr('r','80%');
og.append('stop').attr('offset','0%').attr('stop-color','#2b6890');

og.append('stop').attr('offset','100%').attr('stop-color','#0a2540');
const ag=defs.append('radialGradient').attr('id','ag').attr('cx','50%').attr('cy','50%').attr('r','50%');
ag.append('stop').attr('offset','85%').attr('stop-color','#4a8fb8').attr('stop-opacity',0);

const grat=svg.append('path').datum(d3.geoGraticule10()).attr('fill','none').attr('stroke','#fff').attr('stroke-opacity',0.08).attr('stroke-width',0.5);
const cg=svg.append('g').attr('class','countries');
const pg=svg.append('g').attr('class','pins');

async function loadWorld(){
  // Our own copy first. The two outside ones stay as a last resort only.
  const urls=['countries-50m.json','https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json','https://unpkg.com/world-atlas@2/countries-50m.json'];
  for(const u of urls){
    try{const r=await fetch(u);if(r.ok)return await r.json();}catch(e){}
  }
  throw new Error('no world data');
}

loadWorld().then(w=>{
  const f=topojson.feature(w,w.objects.countries).features;
  cg.selectAll('path').data(f).enter().append('path')
    .attr('fill','#5a8a5e').attr('stroke','#2d4a2f').attr('stroke-width',0.35).attr('stroke-linejoin','round');
  document.getElementById('loader').style.display='none';
  update();
}).catch(()=>{
  const ld=document.getElementById('loader');
  ld.textContent='Globe loaded (limited country detail)';
  setTimeout(()=>ld.style.display='none',2500);
  update();
});

function update(){
  ocean.attr('d',pth);
  grat.attr('d',pth);
  cg.selectAll('path').attr('d',pth);
  atmo.attr('r',S.sc*1.08);
  renderPins();
}

function vis(lng,lat){
  const c=proj.invert([W/2,H/2]);
  if(!c)return false;
  return d3.geoDistance([lng,lat],c)<Math.PI/2;
}

function grpSel(g){
  if(S.selDest&&S.selDest===g.destination)return true;
  if(S.selDream&&g.pins.some(p=>p.name===S.selDream))return true;
  return false;
}

function renderPins(){
  pg.selectAll('*').remove();
  const groups=new Map();
  S.pins.forEach(p=>{
    const k=`${p.lat.toFixed(2)},${p.lng.toFixed(2)}`;
    if(!groups.has(k))groups.set(k,{lat:p.lat,lng:p.lng,destination:p.destination,pins:[]});
    groups.get(k).pins.push(p);
  });
  const sorted=[...groups.values()].sort((a,b)=>(grpSel(a)?1:0)-(grpSel(b)?1:0));
  
  sorted.forEach(g=>{
    if(!vis(g.lng,g.lat))return;
    const pt=proj([g.lng,g.lat]);
    if(!pt)return;
    const [x,y]=pt;
    const sel=grpSel(g);
    const n=g.pins.length;
    const bR=5+Math.min(n-1,4)*1.4;
    const r=sel?bR+2:bR;
    const col=sel?'#E8A87C':'#D4A574';
    const gn=pg.append('g').attr('transform',`translate(${x},${y})`).style('cursor','pointer');
    
    if(sel){
      gn.append('circle').attr('r',r+8).attr('fill','none').attr('stroke','#E8A87C').attr('stroke-width',1.5).attr('opacity',0.5);
      gn.append('circle').attr('r',r+4).attr('fill','none').attr('stroke','#F8F6F0').attr('stroke-width',0.8).attr('opacity',0.6);
    }
    gn.append('circle').attr('r',r).attr('fill',col).attr('stroke','#F8F6F0').attr('stroke-width',2).style('filter','drop-shadow(0 1px 3px rgba(0,0,0,0.5))');
    
    if(n>1){
      gn.append('text').attr('text-anchor','middle').attr('dy',4)
        .attr('font-size',n>9?'10px':'11px').attr('font-weight','700').attr('fill','#3A3A3A')
        .style('pointer-events','none').text(n);
    }
    if(sel){
      const names=g.pins.map(p=>p.name);
      let lbl=names.length===1?`${names[0]} • ${g.destination}`:`${g.destination} (${names.join(', ')})`;
      if(lbl.length>55)lbl=lbl.substring(0,52)+'...';
      gn.append('text').attr('text-anchor','middle').attr('y',-r-9)
        .attr('font-size','12px').attr('font-weight','600').attr('fill','#F8F6F0')
        .style('text-shadow','0 1px 3px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.8)')
        .style('pointer-events','none').text(lbl);
    }
    
    gn.on('mouseenter',(e)=>{S.auto=false;showTT(g,e);});
    gn.on('mousemove',(e)=>moveTT(e));
    gn.on('mouseleave',()=>{if(!S.selDest&&!S.selDream)S.auto=true;hideTT();});
    gn.on('click',(e)=>{e.stopPropagation();selDestGlobe(g);});
  });
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showTT(g,e){
  const names=g.pins.map(p=>p.name).join(', ');
  tt.innerHTML=`<strong>${esc(g.destination)}</strong><br>${esc(names)}`;
  moveTT(e);
  tt.style.opacity='1';
}
function moveTT(e){
  const r=wrap.getBoundingClientRect();
  tt.style.left=(e.clientX-r.left)+'px';
  tt.style.top=(e.clientY-r.top)+'px';
}
function hideTT(){tt.style.opacity='0';}

d3.timer(()=>{
  if(S.auto&&!S.selDream&&!S.selDest&&!drag){
    S.rot[0]+=0.08;
    proj.rotate(S.rot);
    update();
  }
});

let drag=false,dragM=false;
svg.call(d3.drag().clickDistance(5)
  .on('start',()=>{drag=true;dragM=false;S.auto=false;})
  .on('drag',(e)=>{
    dragM=true;
    S.rot[0]+=e.dx*0.4;
    S.rot[1]=Math.max(-90,Math.min(90,S.rot[1]-e.dy*0.4));
    proj.rotate(S.rot);
    update();
  })
  .on('end',()=>{
    drag=false;
    setTimeout(()=>{if(!S.selDream&&!S.selDest)S.auto=true;},1800);
  })
);

svg.on('click',()=>{
  if(dragM)return;
  S.selDest=null;S.selDream=null;S.auto=true;
  renderList();update();
});

document.getElementById('zin').onclick=()=>zoom(1.25);
document.getElementById('zout').onclick=()=>zoom(1/1.25);
svgN.addEventListener('wheel',(e)=>{e.preventDefault();zoom(e.deltaY>0?1/1.1:1.1);},{passive:false});

function zoom(f){
  S.sc=Math.max(150,Math.min(800,S.sc*f));
  proj.scale(S.sc);
  update();
}

function rotTo(lng,lat){
  S.auto=false;
  const tgt=[-lng,-lat*0.7,0];
  const st=[...S.rot];
  while(tgt[0]-st[0]>180)tgt[0]-=360;
  while(tgt[0]-st[0]<-180)tgt[0]+=360;
  const dur=900,t0=Date.now();
  function anim(){
    const el=Date.now()-t0;
    const t=Math.min(el/dur,1);
    const ez=1-Math.pow(1-t,3);
    S.rot=[st[0]+(tgt[0]-st[0])*ez,st[1]+(tgt[1]-st[1])*ez,0];
    proj.rotate(S.rot);
    update();
    if(t<1)requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

function selDestGlobe(g){
  S.selDest=g.destination;
  S.selDream=null;
  rotTo(g.lng,g.lat);
  renderList();
}

const destIn=document.getElementById('destIn'),ac=document.getElementById('ac');
let acI=-1,acM=[];

destIn.addEventListener('input',()=>{
  const q=destIn.value.trim().toLowerCase();
  if(q.length<1){ac.style.display='none';acM=[];return;}
  const m=[];
  for(const [n,la,lo] of DESTS){
    const lw=n.toLowerCase();
    if(lw.startsWith(q))m.push({name:n,lat:la,lng:lo,sc:2});
    else if(lw.includes(q))m.push({name:n,lat:la,lng:lo,sc:1});
    if(m.length>=30)break;
  }
  m.sort((a,b)=>b.sc-a.sc||a.name.length-b.name.length);
  acM=m.slice(0,8);
  acI=-1;
  if(acM.length===0){ac.style.display='none';return;}
  ac.innerHTML=acM.map((m,i)=>`<div class="ac-i" data-i="${i}">${esc(m.name)}</div>`).join('');
  ac.style.display='block';
  ac.querySelectorAll('.ac-i').forEach(el=>{
    el.onmousedown=(e)=>{e.preventDefault();pickAc(parseInt(el.dataset.i));};
  });
});

function pickAc(i){
  const m=acM[i];
  if(!m)return;
  destIn.value=m.name;
  ac.style.display='none';
  acM=[];acI=-1;
}

destIn.addEventListener('keydown',(e)=>{
  if(ac.style.display==='none'||acM.length===0){
    if(e.key==='Enter'){e.preventDefault();addPin();}
    return;
  }
  if(e.key==='ArrowDown'){e.preventDefault();acI=Math.min(acI+1,acM.length-1);updateAcH();}
  else if(e.key==='ArrowUp'){e.preventDefault();acI=Math.max(acI-1,0);updateAcH();}
  else if(e.key==='Enter'){e.preventDefault();if(acI>=0)pickAc(acI);addPin();}
  else if(e.key==='Escape'){ac.style.display='none';}
});

function updateAcH(){
  ac.querySelectorAll('.ac-i').forEach((el,i)=>el.classList.toggle('hv',i===acI));
}

destIn.addEventListener('blur',()=>setTimeout(()=>ac.style.display='none',200));

document.getElementById('addBtn').onclick=addPin;
document.getElementById('nameIn').addEventListener('keydown',(e)=>{
  if(e.key==='Enter'){e.preventDefault();destIn.focus();}
});

function addPin(){
  const name=document.getElementById('nameIn').value.trim();
  const dest=destIn.value.trim();
  if(!name){alert('Add a name.');document.getElementById('nameIn').focus();return;}
  if(!dest){alert('Add a destination.');destIn.focus();return;}
  const m=dmap.get(dest.toLowerCase());
  if(!m){alert(`I don't recognize "${dest}". Pick from the suggestions or try a country or major city name.`);destIn.focus();return;}
  S.pins.push({id:'p'+Date.now()+Math.random().toString(36).substr(2,5),name,destination:m.name,lat:m.lat,lng:m.lng});
  destIn.value='';
  document.getElementById('nameIn').value='';
  document.getElementById('nameIn').focus();
  S.selDest=m.name;S.selDream=null;
  rotTo(m.lng,m.lat);
  saveState();renderList();updateStats();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    S.tab=t.dataset.t;
    renderList();
  };
});

function renderList(){
  const lst=document.getElementById('list');
  if(S.pins.length===0){
    lst.innerHTML='<div class="empty">No dreams pinned yet.<br>'+(document.getElementById('admin').classList.contains('show')?'Add a name and destination above to start.':'Check back soon for new pins.')+'</div>';
    return;
  }
  
  if(S.tab==='top'){
    const cts=new Map();
    S.pins.forEach(p=>{
      if(!cts.has(p.destination))cts.set(p.destination,{count:0,lat:p.lat,lng:p.lng,names:[]});
      const c=cts.get(p.destination);
      c.count++;c.names.push(p.name);
    });
    const sorted=[...cts.entries()].sort((a,b)=>b[1].count-a[1].count||a[0].localeCompare(b[0]));
    lst.innerHTML=sorted.map(([d,info])=>{
      const act=S.selDest===d;
      const sub=act?`<div class="sub">${info.names.map(n=>`<div class="sub-i"><span>${esc(n)}</span></div>`).join('')}</div>`:'';
      return `<div class="item ${act?'active':''}" data-dest="${esc(d)}" data-lng="${info.lng}" data-lat="${info.lat}"><span>${esc(d)}</span><span class="badge">${info.count}</span></div>${sub}`;
    }).join('');
    lst.querySelectorAll('.item').forEach(el=>{
      el.onclick=(e)=>{
        e.stopPropagation();
        const d=el.dataset.dest;
        if(S.selDest===d){S.selDest=null;S.auto=true;}
        else{S.selDest=d;S.selDream=null;rotTo(parseFloat(el.dataset.lng),parseFloat(el.dataset.lat));}
        renderList();update();
      };
    });
  } else {
    const bn=new Map();
    S.pins.forEach(p=>{if(!bn.has(p.name))bn.set(p.name,[]);bn.get(p.name).push(p);});
    const sorted=[...bn.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));
    const isAdmin=document.getElementById('admin').classList.contains('show');
    lst.innerHTML=sorted.map(([name,pins])=>{
      const act=S.selDream===name;
      const sub=act?`<div class="sub">${pins.map(p=>`<div class="sub-i" data-lat="${p.lat}" data-lng="${p.lng}"><span>${esc(p.destination)}</span>${isAdmin?`<button class="del" data-del="${p.id}">remove</button>`:''}</div>`).join('')}</div>`:'';
      return `<div class="item ${act?'active':''}" data-name="${esc(name)}"><span>${esc(name)}</span><span class="badge">${pins.length}</span></div>${sub}`;
    }).join('');
    lst.querySelectorAll('.item').forEach(el=>{
      el.onclick=(e)=>{
        e.stopPropagation();
        const n=el.dataset.name;
        if(S.selDream===n){S.selDream=null;S.auto=true;}
        else{S.selDream=n;S.selDest=null;const f=S.pins.find(p=>p.name===n);if(f)rotTo(f.lng,f.lat);}
        renderList();update();
      };
    });
    lst.querySelectorAll('.sub-i').forEach(el=>{
      el.onclick=(e)=>{
        if(e.target.classList.contains('del'))return;
        e.stopPropagation();
        rotTo(parseFloat(el.dataset.lng),parseFloat(el.dataset.lat));
      };
    });
    lst.querySelectorAll('.del').forEach(el=>{
      el.onclick=(e)=>{
        e.stopPropagation();
        const id=el.dataset.del;
        if(confirm('Remove this pin?')){
          S.pins=S.pins.filter(p=>p.id!==id);
          if(S.selDream&&!S.pins.some(p=>p.name===S.selDream)){S.selDream=null;S.auto=true;}
          saveState();renderList();updateStats();update();
        }
      };
    });
  }
}

function updateStats(){
  document.getElementById('stat').textContent=S.pins.length;
}

// Export / Import
document.getElementById('expBtn').onclick=()=>{
  const data={version:'1.0',updated:new Date().toISOString().split('T')[0],pins:S.pins};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download='dreams.json';a.click();
  URL.revokeObjectURL(u);
};

document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=(e)=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=(ev)=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d.pins)){
        if(confirm(`Load ${d.pins.length} pins? This replaces current data.`)){
          S.pins=d.pins;
          saveState();renderList();updateStats();update();
        }
      } else alert('Invalid file format.');
    }catch(err){alert('Could not parse file.');}
    e.target.value='';
  };
  r.readAsText(f);
};

// Persistence
async function saveState(){
  if(window.storage&&window.storage.set){
    try{await window.storage.set('dreams',JSON.stringify(S.pins));}catch(e){}
  }
}

async function loadState(){
  try{
    const r=await fetch('./dreams.json');
    if(r.ok){
      const d=await r.json();
      if(Array.isArray(d.pins)){S.pins=d.pins;return;}
    }
  }catch(e){}
  if(window.storage&&window.storage.get){
    try{
      const r=await window.storage.get('dreams');
      if(r&&r.value)S.pins=JSON.parse(r.value);
    }catch(e){}
  }
}

loadState().then(()=>{renderList();updateStats();update();});
renderList();updateStats();
</script>
</body>
</html>
