<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%),
      radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%),
      radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%),
      #F8F6F0;
    background-attachment: fixed;
    min-height: 100vh;
    color: #3A3A3A;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button, label, input, textarea { font-family: inherit; }
  button:not(:disabled):hover, label[style*='cursor']:hover { transform: translateY(-2px); }
  button:not(:disabled):active, label[style*='cursor']:active { transform: translateY(0); }
  textarea:focus, input[type='text']:focus, input[type='date']:focus { border-color: #D4A574 !important; outline: none;
    box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18); }
  #root { padding: 0 16px; }

  /* ===== Print stylesheet =====
     When the user clicks "Save as PDF" → window.print() runs.
     Everything with .no-print disappears.
     The .print-area becomes the full page.
     Filename suggestion comes from the <title> tag above. */
  @media print {
    @page {
      size: A4;
      margin: 12mm 10mm;
    }
    @page :first {
      margin: 0;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #2C5F5D !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    #root {
      padding: 0 !important;
    }
    .no-print {
      display: none !important;
    }
    .print-area {
      padding: 0 !important;
      background: #F8F6F0 !important;
      margin: 0 !important;
    }
    .roadmap-doc {
      box-shadow: none !important;
      border-radius: 0 !important;
      max-width: 100% !important;
      margin: 0 !important;
    }
    /* Cover block fills the entire first A4 page edge-to-edge */
    .print-cover {
      page-break-after: always;
      break-after: page;
      width: 210mm !important;
      height: 297mm !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      position: relative;
    }
    /* Each chapter avoids splitting across pages */
    .print-chapter {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    /* The pep talk is the centerpiece — keep it together no matter what */
    .print-peptalk {
      page-break-inside: avoid;
      break-inside: avoid;
      page-break-before: auto;
    }
    /* Footer stays together at the end */
    .print-footer {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    /* Make sure colored backgrounds and borders actually print */
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const T='#2C5F5D',TD='#1e4442',G='#D4A574',GD='#b8884a',C='#F8F6F0',COR='#E8A87C';
const BGP='#ffffff',BGS='#F8F6F0',TXP='#3A3A3A',TXS='#666666',TXT='#999999';
const BDT='#E8E4DC',BDS='#CCBCB0',SUCC_BG='#EAF3DE',SUCC_TX='#3B6D11';
const FINAL_LINK='https://members.soloandfearless.com/classroom/2b6f5b1b-e1b7-47c1-81a0-1f9ff2886f0c/d8ab4181-c4b6-4b17-82e7-d391a10465ac';

// Inline SVG icons (replacing lucide-react)
const Icon = ({ size = 16, children, style }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
    fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
    style={style}>{children}</svg>
);
const UploadIcon = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Icon>;
const ArrowRightIcon = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>;
const ArrowLeftIcon = (p) => <Icon {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Icon>;
const PrinterIcon = (p) => <Icon {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Icon>;

function Hdr({sup,title,dark}) {
  return <div style={{background:dark?TD:T,borderRadius:'12px 12px 0 0',padding:'20px 24px'}}>
    <div style={{fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:G,marginBottom:8}}>{sup}</div>
    <h1 style={{color:C,fontSize:19,fontWeight:500,margin:0,lineHeight:1.4}}>{title}</h1>
  </div>;
}
function Crd({children,onBack}) {
  return <div style={{background:BGP,border:`0.5px solid ${BDT}`,borderRadius:'0 0 12px 12px',padding:'24px'}}>
    {onBack && <button onClick={onBack} style={{background:'#FFFFFF',border:'1px solid rgba(212,165,116,0.55)',color:'#2C5F5D',fontSize:13,fontWeight:700,borderRadius:999,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6,padding:'9px 18px',marginBottom:16,fontFamily:'inherit',boxShadow:'0 8px 22px rgba(212,165,116,0.30)',transition:'transform .2s, box-shadow .2s'}}><ArrowLeftIcon size={13}/> Back</button>}
    {children}
  </div>;
}
function BtnP({onClick,disabled,children}) {
  return <button onClick={onClick} disabled={disabled} style={{background:disabled?BGS:'linear-gradient(to bottom, #37716E, #2C5F5D)',color:disabled?TXT:C,border:disabled?`0.5px solid ${BDT}`:'none',borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:disabled?'not-allowed':'pointer',width:'100%',marginTop:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:disabled?'none':'0 8px 22px rgba(44,95,93,0.32)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
}
function BtnG({onClick,children}) {
  return <button onClick={onClick} style={{background:'linear-gradient(to bottom, #E0B98A, #D4A574)',color:'#142E2C',border:'none',borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:'pointer',width:'100%',marginTop:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:'0 8px 22px rgba(212,165,116,0.45)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
}

const bs=(mb=14)=>({fontSize:15,lineHeight:1.8,color:TXS,marginBottom:mb});
const w={padding:'24px 0',maxWidth:540,margin:'0 auto'};
const hs={fontSize:12,color:TXT,marginTop:6,lineHeight:1.6,fontStyle:'italic'};
const inp={width:'100%',padding:'12px 14px',border:'1px solid rgba(44,95,93,0.2)',borderRadius:12,fontSize:14,lineHeight:1.6,color:TXP,fontFamily:'inherit',outline:'none',background:'#FFFFFF',boxSizing:'border-box',boxShadow:'inset 0 2px 4px rgba(44,95,93,0.07)'};

function formatDate(dateStr) {
  if(!dateStr) return null;
  try{
    const d=new Date(dateStr);
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  } catch{return dateStr;}
}

// === ROADMAP DOCUMENT — bold, celebratory keepsake ===
function RoadmapDoc({data}) {
  const {
    firstName,bookByDate,completedDate,
    currentIdentity,towardIdentity,
    specificFear,
    destination,fearAlignment,
    comfortRating,comfortRead,
    newFactors,
    gutCheckLabel,
    voiceStatement,voiceResponsePath,voiceResponse,voiceResponseGuided,
    pepTalkPath,pepTalk,pepTalkGuided
  } = data;

  const GUIDED_VOICE_LABELS={true:'What is more true',evidence:'Evidence from my life',sayinstead:'What I would say to a friend'};
  const GUIDED_PEP_LABELS={remember:'What I want to remember',whyme:'Why this matters to me',permission:'What I give myself permission to feel'};

  const showAlignmentLine = fearAlignment === 'manageable';

  const INK = '#3A3A3A';

  const ChapterNum = ({n}) => (
    <div style={{
      fontSize:13,
      fontWeight:700,
      letterSpacing:'4px',
      color:GD,
      marginBottom:6
    }}>{n}</div>
  );

  const ChapterTitle = ({children}) => (
    <h2 style={{
      fontSize:26,
      fontWeight:700,
      color:T,
      margin:'0 0 22px',
      lineHeight:1.15,
      letterSpacing:'-0.3px'
    }}>{children}</h2>
  );

  const Field = ({label, value}) => value ? (
    <div style={{marginBottom:18}}>
      <div style={{
        fontSize:10,
        fontWeight:700,
        letterSpacing:'2.5px',
        textTransform:'uppercase',
        color:GD,
        marginBottom:8
      }}>{label}</div>
      <div style={{fontSize:17,lineHeight:1.65,color:INK,fontWeight:500}}>{value}</div>
    </div>
  ) : null;

  const GoldRule = ({width=60}) => (
    <div style={{width,height:3,background:G,margin:'0 auto'}}/>
  );

  return (
    <div className="roadmap-doc" style={{
      background:C,
      padding:0,
      maxWidth:720,
      margin:'0 auto',
      color:INK,
      fontFamily:'inherit',
      borderRadius:8,
      boxShadow:'0 4px 24px rgba(44,95,93,0.12)',
      overflow:'hidden'
    }}>

      {/* ============ COVER BLOCK ============ */}
      <div className="print-cover" style={{
        background:T,
        padding:'56px 48px 48px',
        textAlign:'center',
        position:'relative'
      }}>
        <div style={{position:'absolute',top:20,left:20,width:32,height:32,borderTop:`2px solid ${G}`,borderLeft:`2px solid ${G}`}}/>
        <div style={{position:'absolute',top:20,right:20,width:32,height:32,borderTop:`2px solid ${G}`,borderRight:`2px solid ${G}`}}/>
        <div style={{position:'absolute',bottom:20,left:20,width:32,height:32,borderBottom:`2px solid ${G}`,borderLeft:`2px solid ${G}`}}/>
        <div style={{position:'absolute',bottom:20,right:20,width:32,height:32,borderBottom:`2px solid ${G}`,borderRight:`2px solid ${G}`}}/>

        <div style={{fontSize:11,fontWeight:700,letterSpacing:'5px',textTransform:'uppercase',color:G,marginBottom:24}}>
          Solo &amp; Fearless
        </div>

        <GoldRule width={50}/>

        <h1 style={{
          fontSize:38,
          fontWeight:700,
          color:C,
          margin:'28px 0 14px',
          lineHeight:1.1,
          letterSpacing:'-0.8px'
        }}>The Fearless<br/>First Trip Roadmap</h1>

        <div style={{fontSize:14,color:G,letterSpacing:'2px',textTransform:'uppercase',fontWeight:500,marginBottom:36}}>
          Stop Chickening Out
        </div>

        <div style={{
          display:'inline-block',
          padding:'14px 36px',
          background:'rgba(212, 165, 116, 0.15)',
          border:`1px solid ${G}`,
          borderRadius:4
        }}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'3px',textTransform:'uppercase',color:G,marginBottom:8}}>Belonging to</div>
          <div style={{fontSize:24,fontWeight:700,color:C,letterSpacing:'1px'}}>{firstName}</div>
        </div>
      </div>

      {/* ============ EPIGRAPH ============ */}
      <div style={{
        background:C,
        padding:'44px 48px',
        textAlign:'center',
        borderBottom:`1px solid ${BDT}`
      }}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'3px',textTransform:'uppercase',color:GD,marginBottom:18}}>
          The woman this is for
        </div>
        <div style={{fontSize:22,lineHeight:1.5,color:INK,fontWeight:500,fontStyle:'italic',maxWidth:520,margin:'0 auto'}}>
          "I am becoming the woman who {towardIdentity}."
        </div>
      </div>

      {/* ============ BODY ============ */}
      <div style={{padding:'48px'}}>

        {/* Chapter 01 — Identity */}
        <div className="print-chapter" style={{marginBottom:44}}>
          <ChapterNum n="01"/>
          <ChapterTitle>Who I am</ChapterTitle>
          <Field label="Right now" value={`I am the woman who ${currentIdentity}.`}/>
          <Field label="Becoming" value={`I am becoming the woman who ${towardIdentity}.`}/>
        </div>

        {/* Chapter 02 — Fear */}
        {specificFear && (
          <div className="print-chapter" style={{marginBottom:44}}>
            <ChapterNum n="02"/>
            <ChapterTitle>The fear I named</ChapterTitle>
            <div style={{
              padding:'24px 28px',
              background:'#fff',
              borderLeft:`4px solid ${COR}`,
              borderRadius:'0 6px 6px 0'
            }}>
              <div style={{fontSize:18,lineHeight:1.6,color:INK,fontWeight:500,fontStyle:'italic'}}>
                "{specificFear}"
              </div>
            </div>
          </div>
        )}

        {/* Chapter 03 — Destination */}
        <div className="print-chapter" style={{marginBottom:44}}>
          <ChapterNum n="03"/>
          <ChapterTitle>Where I am going</ChapterTitle>
          <div style={{
            padding:'28px 32px',
            background:T,
            borderRadius:6,
            textAlign:'center'
          }}>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:'3px',textTransform:'uppercase',color:G,marginBottom:10}}>Destination</div>
            <div style={{fontSize:24,fontWeight:700,color:C,letterSpacing:'0.3px'}}>{destination}</div>
            {bookByDate && (
              <div style={{marginTop:14,paddingTop:14,borderTop:`1px solid rgba(212, 165, 116, 0.3)`,fontSize:13,color:G,letterSpacing:'1px'}}>
                Booking by {formatDate(bookByDate)}
              </div>
            )}
          </div>
          {showAlignmentLine && (
            <div style={{fontSize:14,color:INK,marginTop:14,lineHeight:1.6,fontStyle:'italic',opacity:0.75,textAlign:'center'}}>
              A destination that keeps my fear manageable. Strategic, not avoidant.
            </div>
          )}
        </div>

        {/* Chapter 04 — Framework */}
        {(comfortRating || (newFactors && newFactors.length) || gutCheckLabel) && (
          <div className="print-chapter" style={{marginBottom:44}}>
            <ChapterNum n="04"/>
            <ChapterTitle>What I know about the trip</ChapterTitle>
            <div style={{display:'grid',gridTemplateColumns:'1fr',gap:16}}>
              {comfortRating && (
                <div style={{padding:'18px 22px',background:'#fff',border:`1px solid ${BDT}`,borderRadius:6}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:'2.5px',textTransform:'uppercase',color:GD,marginBottom:8}}>Comfort level</div>
                  <div style={{fontSize:17,color:INK,fontWeight:500,lineHeight:1.5}}>
                    {comfortRating} out of 10{comfortRead?` — ${comfortRead}`:''}
                  </div>
                </div>
              )}
              {newFactors && newFactors.length>0 && (
                <div style={{padding:'18px 22px',background:'#fff',border:`1px solid ${BDT}`,borderRadius:6}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:'2.5px',textTransform:'uppercase',color:GD,marginBottom:8}}>What is new on this trip</div>
                  <div style={{fontSize:17,color:INK,fontWeight:500,lineHeight:1.5}}>{newFactors.join(' · ')}</div>
                </div>
              )}
              {gutCheckLabel && (
                <div style={{padding:'18px 22px',background:'#fff',border:`1px solid ${BDT}`,borderRadius:6}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:'2.5px',textTransform:'uppercase',color:GD,marginBottom:8}}>What my gut says</div>
                  <div style={{fontSize:17,color:INK,fontWeight:500,lineHeight:1.5}}>{gutCheckLabel}</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* Chapter 05 — Voice + Response */}
        {voiceStatement && (
          <div className="print-chapter" style={{marginBottom:44}}>
            <ChapterNum n="05"/>
            <ChapterTitle>The voice and my answer</ChapterTitle>

            <div style={{
              padding:'22px 26px',
              background:'#fff',
              borderLeft:`4px solid ${COR}`,
              borderRadius:'0 6px 6px 0',
              marginBottom:20
            }}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'2.5px',textTransform:'uppercase',color:'#a05010',marginBottom:8}}>What my voice says</div>
              <div style={{fontSize:17,lineHeight:1.6,color:INK,fontWeight:500,fontStyle:'italic'}}>
                "{voiceStatement}"
              </div>
            </div>

            <div style={{
              padding:'22px 26px',
              background:'#fff',
              borderLeft:`4px solid ${T}`,
              borderRadius:'0 6px 6px 0'
            }}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'2.5px',textTransform:'uppercase',color:T,marginBottom:10}}>What I say back</div>
              {voiceResponsePath==='blank' || !voiceResponseGuided ? (
                <div style={{fontSize:17,lineHeight:1.65,color:INK,fontWeight:500,whiteSpace:'pre-wrap'}}>{voiceResponse}</div>
              ) : (
                <div>
                  {Object.entries(voiceResponseGuided).filter(([k,v])=>v&&v.trim()).map(([k,v],i)=>(
                    <div key={k} style={{marginTop:i===0?0:16}}>
                      <div style={{fontSize:11,color:GD,marginBottom:5,fontStyle:'italic',fontWeight:600,letterSpacing:'0.5px'}}>{GUIDED_VOICE_LABELS[k]}</div>
                      <div style={{fontSize:17,lineHeight:1.65,color:INK,fontWeight:500,whiteSpace:'pre-wrap'}}>{v.trim()}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {/* Chapter 06 — Pep talk */}
        {pepTalk && (
          <div className="print-peptalk" style={{marginBottom:24}}>
            <ChapterNum n="06"/>
            <ChapterTitle>My pep talk</ChapterTitle>

            <div style={{
              padding:'36px 36px',
              background:`linear-gradient(135deg, ${C} 0%, #f0ebe0 100%)`,
              border:`2px solid ${G}`,
              borderRadius:8
            }}>
              <div>
                {pepTalkPath==='blank' || !pepTalkGuided ? (
                  <div style={{fontSize:19,lineHeight:1.7,color:INK,fontWeight:500,whiteSpace:'pre-wrap',fontStyle:'italic'}}>{pepTalk}</div>
                ) : (
                  <div>
                    {Object.entries(pepTalkGuided).filter(([k,v])=>v&&v.trim()).map(([k,v],i)=>(
                      <div key={k} style={{marginTop:i===0?0:22}}>
                        <div style={{fontSize:11,color:GD,marginBottom:6,fontStyle:'italic',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase'}}>{GUIDED_PEP_LABELS[k]}</div>
                        <div style={{fontSize:19,lineHeight:1.7,color:INK,fontWeight:500,whiteSpace:'pre-wrap',fontStyle:'italic'}}>{v.trim()}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div style={{marginTop:24,paddingTop:18,borderTop:`1px solid ${G}`,textAlign:'right'}}>
                <div style={{fontSize:13,color:GD,fontStyle:'italic',fontWeight:500}}>— {firstName}, to herself</div>
              </div>
            </div>
          </div>
        )}

      </div>

      {/* ============ FOOTER ============ */}
      <div className="print-footer" style={{
        background:C,
        padding:'40px 48px 32px',
        borderTop:`1px solid ${BDT}`,
        textAlign:'center'
      }}>
        <GoldRule width={40}/>

        <div style={{marginTop:24,fontSize:13,color:INK,lineHeight:1.7,fontStyle:'italic',maxWidth:460,margin:'24px auto 0',opacity:0.85}}>
          When you are ready to go further, <span style={{color:T,fontWeight:600,fontStyle:'normal'}}>The Fearless Ones Program</span> is where this roadmap becomes the next chapter.
        </div>

        <div style={{marginTop:36,paddingTop:24,borderTop:`1px solid ${BDT}`}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'4px',textTransform:'uppercase',color:GD,marginBottom:8}}>
            Solo &amp; Fearless
          </div>
          <div style={{fontSize:11,color:TXS,lineHeight:1.7}}>
            {bookByDate && <span>Booking by {formatDate(bookByDate)} &nbsp;·&nbsp; </span>}
            Completed {formatDate(completedDate)}
          </div>
        </div>
      </div>

    </div>
  );
}

function App() {
  const [screen,setScreen]=useState('import');
  const [p7,setP7]=useState(null);
  const [importErr,setImportErr]=useState(false);
  const [firstName,setFirstName]=useState('');
  const [bookByDate,setBookByDate]=useState('');
  const [completedDate]=useState(new Date().toISOString().split('T')[0]);

  const goBack=()=>{
    switch(screen){
      case 'welcome-back': setScreen('import'); break;
      case 'personalize': setScreen('welcome-back'); break;
      case 'reveal': setScreen('personalize'); break;
      default: break;
    }
  };

  const handleImport=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    setImportErr(false);
    const reader=new FileReader();
    reader.onload=(evt)=>{
      try{
        const d=JSON.parse(evt.target.result);
        if(!d.currentIdentity||!d.towardIdentity||!d.destination||!d.pepTalk) throw new Error();
        setP7(d); setScreen('welcome-back');
      } catch{setImportErr(true);}
    };
    reader.readAsText(file);
  };

  const docData = p7 ? {
    firstName:firstName.trim()||'You',
    bookByDate:bookByDate||null,
    completedDate,
    ...p7
  } : null;

  const handlePrint = () => {
    // Set a meaningful filename for the PDF that browsers will suggest
    const originalTitle = document.title;
    document.title = 'Fearless_First_Trip_Roadmap';
    window.print();
    // Restore after print dialog closes
    setTimeout(() => { document.title = originalTitle; }, 100);
  };

  if(screen==='import') return (
    <div style={w}>
      <div className="no-print">
        <Hdr sup="Stop Chickening Out — Final Words" title="Your roadmap is ready"/>
        <Crd>
          <p style={bs()}>You made it. Every layer you have built across this course comes together now — your identity, your fear, your destination, your voice, your pep talk. All of it.</p>
          <p style={bs(20)}>Upload your saved file from the previous session, and the roadmap reveals itself.</p>
          <label style={{display:'block',background:'linear-gradient(to bottom, #37716E, #2C5F5D)',color:C,borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:'pointer',textAlign:'center',marginBottom:importErr?8:0,boxShadow:'0 8px 22px rgba(44,95,93,0.32)',transition:'transform .2s, box-shadow .2s'}}>
            <input type="file" accept=".json" onChange={handleImport} style={{display:'none'}}/>
            <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><UploadIcon size={15}/> Upload Fearless_Roadmap_Progress7.json</span>
          </label>
          {importErr && <p style={{fontSize:13,color:'#c0392b',marginTop:8,lineHeight:1.6}}>That does not look like the right file. Make sure you are uploading Fearless_Roadmap_Progress7.json from the previous session.</p>}
          <p style={{...hs,marginTop:16}}>No file yet? Complete the Module 5 Lesson 5 session first.</p>
        </Crd>
      </div>
    </div>
  );

  if(screen==='welcome-back') return (
    <div style={w}>
      <div className="no-print">
        <Hdr sup="Final Words" title="Welcome back, for the last time"/>
        <Crd onBack={goBack}>
          <p style={bs()}>Across this course you have done something most women never do — you stopped researching and started building. You named what stops you. You chose where you want to go. You wrote your own response to the voice that has been talking you out of it. You wrote your own pep talk.</p>
          <p style={bs()}>None of it was small. All of it was yours.</p>
          <p style={bs(20)}>Before we reveal your roadmap, one more thing — let us make it personal.</p>
          <BtnP onClick={()=>setScreen('personalize')}>Personalize my roadmap <ArrowRightIcon size={15}/></BtnP>
        </Crd>
      </div>
    </div>
  );

  if(screen==='personalize') return (
    <div style={w}>
      <div className="no-print">
        <Hdr sup="One last step" title="Make it yours"/>
        <Crd onBack={goBack}>
          <p style={bs(20)}>Add your name and, if you want, the date you intend to book by. This roadmap will carry both. It becomes a document with your name on it — a real thing, not a form.</p>

          <div style={{marginBottom:18}}>
            <div style={{fontSize:13,fontWeight:500,color:TXP,marginBottom:6}}>Your first name</div>
            <input
              type="text"
              value={firstName}
              onChange={(e)=>setFirstName(e.target.value)}
              placeholder="The name you want on your roadmap"
              style={inp}/>
          </div>

          <div style={{marginBottom:6}}>
            <div style={{fontSize:13,fontWeight:500,color:TXP,marginBottom:6}}>Booking by <span style={{color:TXT,fontWeight:400}}>— optional</span></div>
            <input
              type="date"
              value={bookByDate}
              onChange={(e)=>setBookByDate(e.target.value)}
              style={inp}/>
            <p style={{...hs,marginTop:6}}>A date you want to have booked your trip by. Leave blank if you would rather not name one yet.</p>
          </div>

          <div style={{marginTop:18,padding:'12px 14px',background:BGS,borderLeft:`3px solid ${G}`,borderRadius:'0 6px 6px 0'}}>
            <div style={{fontSize:12,color:TXS,lineHeight:1.6}}>Today's date — <span style={{fontWeight:500,color:TXP}}>{formatDate(completedDate)}</span> — will be on your roadmap as the day you completed the course.</div>
          </div>

          <BtnP onClick={()=>setScreen('reveal')} disabled={!firstName.trim()}>Reveal my roadmap <ArrowRightIcon size={15}/></BtnP>
        </Crd>
      </div>
    </div>
  );

  if(screen==='reveal' && docData) return (
    <div>
      <div className="no-print" style={{...w,marginBottom:0}}>
        <Hdr dark sup="Your Fearless First Trip Roadmap" title={`${docData.firstName}, this is yours`}/>
        <Crd>
          <p style={bs(8)}>Below is your complete roadmap. Read through it. Sit with it.</p>
          <p style={bs(20)}>When you are ready, save it as a PDF — keep it somewhere you will see it.</p>
          <BtnG onClick={handlePrint}><PrinterIcon size={15}/> Save as PDF — Fearless_First_Trip_Roadmap.pdf</BtnG>
          <p style={{...hs,marginTop:14,textAlign:'center'}}>Your browser will open the print dialog. Choose "Save as PDF" as the destination.</p>
        </Crd>
      </div>

      <div className="print-area" style={{padding:'32px 16px 80px',background:'#f4f1ea'}}>
        <RoadmapDoc data={docData}/>
      </div>

      <div className="no-print" style={{...w,paddingTop:0}}>
        <Crd>
          <a href={FINAL_LINK} target="_blank" rel="noopener noreferrer" style={{textDecoration:'none'}}>
            <BtnP>Return to the course <ArrowRightIcon size={15}/></BtnP>
          </a>
        </Crd>
      </div>
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
