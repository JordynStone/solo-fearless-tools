<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fearless First Trip Roadmap — Layer 2</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; background:
        radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%),
        radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%),
        radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%),
        #F8F6F0;
      background-attachment: fixed; min-height: 100vh; padding: 16px; color: #3A3A3A; }
    textarea:focus { border-color: #D4A574 !important; outline: none; box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18); }
    a { text-decoration: none; }
    button:not(:disabled):hover, label[style*='cursor']:hover { transform: translateY(-2px); }
    button:not(:disabled):active { transform: translateY(0); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const T='#2C5F5D',TD='#1e4442',G='#D4A574',C='#F8F6F0',COR='#E8A87C';
    const BGP='#ffffff',BGS='#F8F6F0',TXP='#3A3A3A',TXS='#666666',TXT='#999999';
    const BDT='#E8E4DC',BDS='#CCBCB0',SUCC_BG='#EAF3DE',SUCC_TX='#3B6D11';
    const NEXT='https://www.skool.com/solo-and-fearless-3331/classroom/f50566b1?md=c8ae46f8ae14443082fe637cfe5cef1b';

    const Q1=[
      {id:'yes',label:'Yes, I can describe exactly what I am afraid will happen',desc:'It has a specific shape in my mind.',lean:'real'},
      {id:'no',label:'Not really',desc:'It is more of a general feeling that something could go wrong.',lean:'fear'}
    ];
    const Q2=[
      {id:'prepared',label:'I find useful information that helps me feel more equipped',desc:'Research makes it feel more manageable.',lean:'real'},
      {id:'scared',label:'I end up more scared and anxious',desc:'The more I look, the worse it feels.',lean:'fear'},
      {id:'circles',label:'I go in circles and never land anywhere useful',desc:'I have not been able to properly research it.',lean:'fear'}
    ];
    const Q3=[
      {id:'yes',label:'Yes, a direct answer from the right source would genuinely help',desc:'If someone who has actually done this could tell me the truth, I would feel better.',lean:'real'},
      {id:'no',label:'Probably not',desc:'Even a reassuring answer probably would not make this feel better.',lean:'fear'}
    ];

    const IcoUp    = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const IcoRight = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>;
    const IcoLeft  = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>;
    const IcoDl    = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IcoCheck = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12l5 6L20 6"/></svg>;

    function Hdr({sup,title,dark}) {
      return <div style={{background:dark?TD:T,borderRadius:'12px 12px 0 0',padding:'20px 24px'}}>
        <div style={{fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:G,marginBottom:8}}>{sup}</div>
        <h1 style={{color:C,fontSize:19,fontWeight:500,margin:0,lineHeight:1.4}}>{title}</h1>
      </div>;
    }
    function Crd({children,onBack}) {
      return <div style={{background:BGP,border:`0.5px solid ${BDT}`,borderRadius:'0 0 12px 12px',padding:'24px'}}>
        {onBack && <button onClick={onBack} style={{background:'#FFFFFF',border:'1px solid rgba(212,165,116,0.55)',color:'#2C5F5D',fontSize:13,fontWeight:700,borderRadius:999,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6,padding:'9px 18px',marginBottom:16,fontFamily:'inherit',boxShadow:'0 8px 22px rgba(212,165,116,0.30)',transition:'transform .2s, box-shadow .2s'}}><IcoLeft size={13}/> Back</button>}
        {children}
      </div>;
    }
    function BtnP({onClick,disabled,children}) {
      return <button onClick={onClick} disabled={disabled} style={{background:disabled?BGS:'linear-gradient(to bottom, #37716E, #2C5F5D)',color:disabled?TXT:C,border:disabled?`0.5px solid ${BDT}`:'none',borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:disabled?'not-allowed':'pointer',width:'100%',marginTop:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:disabled?'none':'0 8px 22px rgba(44,95,93,0.32)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
    }
    function BtnG({onClick,children}) {
      return <button onClick={onClick} style={{background:'linear-gradient(to bottom, #E0B98A, #D4A574)',color:'#142E2C',border:'none',borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:'pointer',width:'100%',marginTop:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:'0 8px 22px rgba(212,165,116,0.45)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
    }
    function BtnSec({onClick,children}) {
      return <button onClick={onClick} style={{background:'#FFFFFF',color:'#2C5F5D',border:'1px solid rgba(212,165,116,0.55)',borderRadius:999,padding:'12px 22px',fontSize:13,fontWeight:700,cursor:'pointer',width:'100%',marginTop:10,display:'flex',alignItems:'center',justifyContent:'center',gap:6,boxShadow:'0 8px 22px rgba(212,165,116,0.30)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
    }
    function TA({value,onChange,placeholder,rows=4}) {
      return <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows}
        style={{width:'100%',padding:'10px 12px',fontSize:14,border:`0.5px solid ${BDS}`,borderRadius:12,background:'#FFFFFF',color:TXP,resize:'vertical',boxShadow:'inset 0 2px 4px rgba(44,95,93,0.07)',fontFamily:'inherit',lineHeight:1.7,boxSizing:'border-box',marginTop:8,display:'block'}}/>;
    }
    function NoteBox({title,children,accent}) {
      return <div style={{background:BGS,borderLeft:`3px solid ${accent||G}`,padding:'12px 14px',marginBottom:14}}>
        {title && <div style={{fontSize:13,fontWeight:500,color:TXP,marginBottom:4}}>{title}</div>}
        <div style={{fontSize:13,color:TXS,lineHeight:1.7}}>{children}</div>
      </div>;
    }
    function SavedBlk({label,accent,prefix,value}) {
      return <div style={{background:BGS,borderLeft:`3px solid ${accent}`,padding:'14px 16px',marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:500,textTransform:'uppercase',letterSpacing:'1.5px',color:accent===T?T:accent===G?'#b8884a':'#a05010',marginBottom:8}}>{label}</div>
        <p style={{margin:0,fontSize:15,lineHeight:1.7}}>
          {prefix && <span style={{color:TXT,fontSize:13}}>{prefix} </span>}
          <span style={{fontWeight:500}}>{value}</span>
        </p>
      </div>;
    }
    function FearTag({children}) {
      return <div style={{background:BGS,border:`0.5px solid ${BDS}`,borderRadius:8,padding:'12px 14px',margin:'12px 0'}}>
        <div style={{fontSize:11,fontWeight:500,textTransform:'uppercase',letterSpacing:'1.5px',color:TXS,marginBottom:6}}>Your fear</div>
        <div style={{fontSize:15,fontWeight:500,lineHeight:1.6,color:TXP}}>{children}</div>
      </div>;
    }
    function QCard({option,onClick}) {
      const [hov,setHov]=useState(false);
      return <div onClick={()=>onClick(option.id)} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{border:`1.5px solid ${hov?T:BDS}`,borderRadius:14,boxShadow:'0 10px 30px rgba(44,95,93,0.09)',transition:'transform .2s, box-shadow .2s',padding:'14px 16px',cursor:'pointer',marginBottom:10,background:hov?BGS:BGP,transition:'border-color 0.15s, background 0.15s'}}>
        <div style={{fontWeight:500,fontSize:14,marginBottom:4,color:TXP}}>{option.label}</div>
        <div style={{fontSize:12,color:TXS,lineHeight:1.6}}>{option.desc}</div>
      </div>;
    }
    function Dots({n,total}) {
      return <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:20}}>
        {Array.from({length:total}).map((_,i)=>(
          <div key={i} style={{width:7,height:7,borderRadius:'50%',background:i<n?G:i===n?T:BDS,transition:'background 0.2s'}}/>
        ))}
      </div>;
    }

    const bs=(mb=14)=>({fontSize:15,lineHeight:1.8,color:TXS,marginBottom:mb});
    const hs={fontSize:12,color:TXT,marginTop:6,lineHeight:1.6,fontStyle:'italic'};
    const ls={fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:T,display:'block',marginBottom:4};
    const short=s=>s.trim().length<5;
    const w={padding:'24px 0',maxWidth:540,margin:'0 auto'};

    function App() {
      const [screen,setScreen]=useState('import');
      const [p1,setP1]=useState(null);
      const [importErr,setImportErr]=useState(false);
      const [fear,setFear]=useState('');
      const [q1ans,setQ1ans]=useState(null);
      const [q2ans,setQ2ans]=useState(null);
      const [q3ans,setQ3ans]=useState(null);
      const [classification,setClassification]=useState(null);
      const [reflection,setReflection]=useState('');

      const classify=(q1,q2,q3)=>{
        const l1=q1==='yes'?'real':'fear';
        const l2=q2==='prepared'?'real':'fear';
        if(q3===null) return l1===l2?l1:null;
        const l3=q3==='yes'?'real':'fear';
        return [l1,l2,l3].filter(l=>l==='real').length>=2?'real':'fear';
      };

      const handleQ2=(ans)=>{
        setQ2ans(ans);
        const l1=q1ans==='yes'?'real':'fear';
        const l2=ans==='prepared'?'real':'fear';
        if(l1===l2){setClassification(l1);setScreen('result');}
        else setScreen('q3');
      };
      const handleQ3=(ans)=>{
        setQ3ans(ans);
        setClassification(classify(q1ans,q2ans,ans));
        setScreen('result');
      };

      const goBack=()=>{
        switch(screen){
          case 'welcome-back': setScreen('import'); break;
          case 'name-fear': setScreen('welcome-back'); break;
          case 'q1': setScreen('name-fear'); break;
          case 'q2': setScreen('q1'); break;
          case 'q3': setScreen('q2'); break;
          case 'result': setScreen(q3ans!==null?'q3':'q2'); break;
          case 'real-reflect': setScreen('result'); break;
          case 'fear-ack': setScreen('result'); break;
          case 'unsure-ack': setScreen('result'); break;
          case 'review':
            classification==='real'?setScreen('real-reflect'):
            classification==='unsure'?setScreen('unsure-ack'):
            setScreen('fear-ack');
            break;
          default: break;
        }
      };

      const handleImport=(e)=>{
        const file=e.target.files[0]; if(!file) return;
        setImportErr(false);
        const reader=new FileReader();
        reader.onload=(evt)=>{
          try{
            const d=JSON.parse(evt.target.result);
            if(!d.currentIdentity||!d.towardIdentity) throw new Error();
            setP1(d); setScreen('welcome-back');
          } catch{setImportErr(true);}
        };
        reader.readAsText(file);
      };

      const doExport=()=>{
        const d={artifact:2,module:'module2_fear_vs_fact',currentIdentity:p1.currentIdentity,towardIdentity:p1.towardIdentity,specificFear:fear,fearClassification:classification,fearReflection:reflection||null,savedAt:new Date().toISOString()};
        const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download='Fearless_Roadmap_Progress2.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        setScreen('done');
      };

      if(screen==='import') return (
        <div style={w}>
          <Hdr sup="Stop Chickening Out — Module 2" title="Fear vs Fact"/>
          <Crd>
            <p style={bs()}>Module 2 is about separating real safety concerns from the ones your brain invented. In this session you will apply that framework directly to your own fear.</p>
            <p style={bs(20)}>To continue building your Fearless First Trip Roadmap, upload your saved file from the previous session.</p>
            <label style={{display:'block',background:'linear-gradient(to bottom, #37716E, #2C5F5D)',color:C,borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:'pointer',textAlign:'center',marginBottom:importErr?8:0,boxShadow:'0 8px 22px rgba(44,95,93,0.32)',transition:'transform .2s, box-shadow .2s'}}>
              <input type="file" accept=".json" onChange={handleImport} style={{display:'none'}}/>
              <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><IcoUp size={15}/> Upload Fearless_Roadmap_Progress1.json</span>
            </label>
            {importErr && <p style={{fontSize:13,color:'#c0392b',marginTop:8,lineHeight:1.6}}>That does not look like the right file. Make sure you are uploading Fearless_Roadmap_Progress1.json from the Module 1 session.</p>}
            <p style={{...hs,marginTop:16}}>No file yet? Complete the Module 1 session first. Your file will be named Fearless_Roadmap_Progress1.json.</p>
          </Crd>
        </div>
      );

      if(screen==='welcome-back') return (
        <div style={w}>
          <Hdr sup="Module 2 — Lesson 2" title="Welcome back"/>
          <Crd onBack={goBack}>
            <p style={bs()}>Your roadmap is carrying everything you built in your last session.</p>
            <div style={{marginBottom:20}}>
              <SavedBlk label="Right now" accent={T} prefix="I am the woman who" value={p1.currentIdentity}/>
              <SavedBlk label="Becoming" accent={G} prefix="I am becoming the woman who" value={p1.towardIdentity}/>
            </div>
            <p style={bs()}>In this session you are going to name the specific fear that keeps stopping you. A few honest questions will help you understand it better.</p>
            <p style={bs(4)}>This session cannot resolve a fear that has been with you for years. That is not what it is for. What it can do is help you see it more clearly. That is enough for right now.</p>
            <BtnP onClick={()=>setScreen('name-fear')}>Let us name it <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if(screen==='name-fear') return (
        <div style={w}>
          <Hdr sup="Layer 2 — Naming the fear" title="What is the specific fear?"/>
          <Crd onBack={goBack}>
            <p style={bs()}>Not the general nervousness. The specific thing that shows up when you get close to booking.</p>
            <label style={ls}>The fear that stops me is...</label>
            <TA value={fear} onChange={setFear} placeholder="e.g. not speaking the language, something going wrong with no one to help me, being judged for traveling alone"/>
            <p style={hs}>Write it exactly as it sounds in your head. Do not clean it up.</p>
            <BtnP disabled={short(fear)} onClick={()=>setScreen('q1')}>Continue <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if(screen==='q1') return (
        <div style={w}>
          <Hdr sup="Layer 2 — Question 1 of 2" title="Let us look at this honestly"/>
          <Crd onBack={goBack}>
            <Dots n={0} total={2}/>
            <FearTag>{fear}</FearTag>
            <p style={{...bs(20),fontWeight:500,color:TXP}}>If someone asked you to describe exactly what you are afraid will happen — could you do it in one specific sentence?</p>
            {Q1.map(o=><QCard key={o.id} option={o} onClick={(ans)=>{setQ1ans(ans);setScreen('q2');}}/>)}
          </Crd>
        </div>
      );

      if(screen==='q2') return (
        <div style={w}>
          <Hdr sup="Layer 2 — Question 2 of 2" title="One more question"/>
          <Crd onBack={goBack}>
            <Dots n={1} total={2}/>
            <FearTag>{fear}</FearTag>
            <p style={{...bs(20),fontWeight:500,color:TXP}}>When you have thought about or researched this fear before, what tends to happen?</p>
            {Q2.map(o=><QCard key={o.id} option={o} onClick={handleQ2}/>)}
          </Crd>
        </div>
      );

      if(screen==='q3') return (
        <div style={w}>
          <Hdr sup="Layer 2 — One more thing" title="Almost there"/>
          <Crd onBack={goBack}>
            <FearTag>{fear}</FearTag>
            <p style={{...bs(20),fontWeight:500,color:TXP}}>If someone who has actually traveled to your destination could give you a direct, honest answer about this — do you think it would genuinely help?</p>
            {Q3.map(o=><QCard key={o.id} option={o} onClick={handleQ3}/>)}
          </Crd>
        </div>
      );

      if(screen==='result') {
        const isReal=classification==='real';
        return (
          <div style={w}>
            <Hdr sup={isReal?'Your answers suggest a real concern':'Your answers suggest fear in disguise'} title={isReal?'This might be worth preparing for':'This might not be what it looks like'}/>
            <Crd onBack={goBack}>
              <FearTag>{fear}</FearTag>
              <NoteBox accent={BDS} title="Before you read this">Your answers suggest a direction. They are not a verdict. You know your own fear better than any set of questions does.</NoteBox>
              {isReal
                ? <>
                    <p style={bs()}>Based on what you told us, this fear has a specific shape and there may be honest information out there that could help you feel more prepared for it.</p>
                    <p style={bs(20)}>The next lesson in this module gives you the exact framework for researching it properly. For now, we will add one reflection to your roadmap.</p>
                  </>
                : <>
                    <p style={bs()}>Based on what you told us, this fear tends to get vaguer when examined and bigger when researched. That is often the signature of fear wearing a concern's costume rather than a real problem with a real solution.</p>
                    <p style={bs(20)}>That does not mean the feeling is not real. It just means more research is unlikely to help. Naming it is what helps.</p>
                  </>
              }
              <BtnP onClick={()=>setScreen(isReal?'real-reflect':'fear-ack')}>
                {isReal?'Add a reflection and continue':'I understand, continue'} <IcoRight size={15}/>
              </BtnP>
              {isReal
                ? <BtnSec onClick={()=>{setClassification('fear');setScreen('fear-ack');}}>This actually feels more like fear wearing a costume</BtnSec>
                : <BtnSec onClick={()=>{setClassification('real');setScreen('real-reflect');}}>This actually feels more like a real concern</BtnSec>
              }
              <BtnSec onClick={()=>{setClassification('unsure');setScreen('unsure-ack');}}>I am honestly not sure about any of this</BtnSec>
            </Crd>
          </div>
        );
      }

      if(screen==='real-reflect') return (
        <div style={w}>
          <Hdr sup="Real concern identified" title="One honest question"/>
          <Crd onBack={goBack}>
            <FearTag>{fear}</FearTag>
            <p style={bs()}>You do not need to have a plan right now. The course will give you the tools to research this properly in the lessons ahead.</p>
            <p style={bs(20)}>For now, just one question. There is no wrong answer.</p>
            <label style={ls}>What would make this feel less overwhelming to you?</label>
            <TA value={reflection} onChange={setReflection} placeholder="e.g. more honest information from someone who has actually been there, knowing that other women have faced this exact fear and gone anyway, just having a clearer picture of what I am actually dealing with"/>
            <p style={hs}>This is for you. It does not have to be a plan. It does not have to be perfect. It just has to be honest.</p>
            <BtnP disabled={short(reflection)} onClick={()=>setScreen('review')}>Add to my roadmap <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if(screen==='fear-ack') return (
        <div style={w}>
          <Hdr sup="Fear identified" title="You named it"/>
          <Crd onBack={goBack}>
            <FearTag>{fear}</FearTag>
            <p style={bs()}>Good. That took honesty.</p>
            <p style={bs()}>Here is what naming it does. Every time this fear shows up from now on, you already know what it is. Not a concern. Not a reason. Fear wearing a costume.</p>
            <p style={bs(20)}>It will still show up. It is allowed to. It just does not get to make your decisions anymore.</p>
            <NoteBox title="The one thing to remember">When this fear shows up, name it. Out loud if you have to. "That is not a real concern. That is fear wearing a costume." Then move on.</NoteBox>
            <BtnP onClick={()=>setScreen('review')}>See my full roadmap <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if(screen==='unsure-ack') return (
        <div style={w}>
          <Hdr sup="That is honest" title="Not every fear fits neatly"/>
          <Crd onBack={goBack}>
            <FearTag>{fear}</FearTag>
            <p style={bs()}>Some fears are genuinely hard to categorise. They are real and they are not. They have a specific shape and they are vague at the same time. They deserve attention and they cannot be researched away all at once.</p>
            <p style={bs()}>Not being able to name which category it falls into does not mean you are stuck. It means you are being honest about something complicated.</p>
            <p style={bs(20)}>What matters is that you named the fear itself. It is in your roadmap. The lessons ahead will keep working with it. You do not need a neat answer right now.</p>
            <NoteBox title="What goes into your roadmap">Your fear is named and saved. The understanding will deepen as you continue through the course. That is exactly how this is supposed to work.</NoteBox>
            <BtnP onClick={()=>setScreen('review')}>Add it to my roadmap <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if(screen==='review') return (
        <div style={w}>
          <Hdr sup="Layer 2 complete" title="Your roadmap is growing"/>
          <Crd onBack={goBack}>
            <p style={bs(20)}>Everything you have built so far. Read it as a whole.</p>
            <SavedBlk label="Right now" accent={T} prefix="I am the woman who" value={p1.currentIdentity}/>
            <SavedBlk label="Becoming" accent={G} prefix="I am becoming the woman who" value={p1.towardIdentity}/>
            <SavedBlk label="My specific fear" accent={COR} value={fear}/>
            <SavedBlk label="What my answers suggest" accent={classification==='real'?T:classification==='unsure'?G:COR}
              value={classification==='real'?'A real concern — the course will give you the tools to research it properly':
                     classification==='unsure'?'Complex — still working through it as the course continues':
                     'Fear wearing a costume — not a real problem to solve, a pattern to name'}/>
            {classification==='real' && reflection && <SavedBlk label="What would help" accent={T} value={reflection}/>}
            <p style={{fontSize:14,lineHeight:1.7,color:TXS,marginTop:16,marginBottom:0}}>Save your progress before you continue.</p>
            <BtnG onClick={doExport}><IcoDl size={15}/> Save my progress — Fearless_Roadmap_Progress2.json</BtnG>
          </Crd>
        </div>
      );

      if(screen==='done') return (
        <div style={w}>
          <Hdr dark sup="Progress saved" title="Layer 2 is in your roadmap"/>
          <Crd>
            <div style={{background:SUCC_BG,borderRadius:8,padding:'12px 14px',marginBottom:16,display:'flex',gap:10,alignItems:'flex-start'}}>
              <IcoCheck size={16} style={{color:SUCC_TX,marginTop:2,flexShrink:0}}/>
              <div>
                <div style={{fontSize:13,fontWeight:500,color:SUCC_TX,marginBottom:3}}>Fearless_Roadmap_Progress2.json saved</div>
                <div style={{fontSize:13,color:TXS,lineHeight:1.6}}>Keep this file. You will need it for the next exercise later in the course.</div>
              </div>
            </div>
            <NoteBox title="Keep your file safe">Your progress is saved in Fearless_Roadmap_Progress2.json. When the next exercise moment arrives, you will be asked to upload it to continue building.</NoteBox>
            <a href={NEXT} target="_blank" rel="noopener noreferrer">
              <BtnP>Continue in the course <IcoRight size={15}/></BtnP>
            </a>
          </Crd>
        </div>
      );

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
