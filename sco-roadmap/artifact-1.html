<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fearless First Trip Roadmap — Layer 1</title>
  <!-- Go's decision, 2 August 2026: the tools stay out of search. They are things her members open from a lesson, not pages to be found. Crawling is deliberately left allowed, because a blocked page cannot be read and so cannot be told to stay out. -->
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="../vendor/react.production.min.js" crossorigin></script>
  <script src="../vendor/react-dom.production.min.js" crossorigin></script>
  <script src="../vendor/babel.min.js"></script>
  <link rel="stylesheet" href="/fonts/montserrat.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%),
        radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%),
        radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%),
        #F8F6F0;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 16px;
      color: #3A3A3A;
    }
    textarea:focus { border-color: #D4A574 !important; outline: none; box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18); }
    a { text-decoration: none; }
    button:not(:disabled):hover, label[style*='cursor']:hover { transform: translateY(-2px); }
    button:not(:disabled):active { transform: translateY(0); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const T   = '#2C5F5D';
    const TD  = '#1e4442';
    const G   = '#D4A574';
    const C   = '#F8F6F0';
    const LINK = 'https://members.soloandfearless.com/classroom/2b6f5b1b-e1b7-47c1-81a0-1f9ff2886f0c/abf19621-4111-4999-a988-512933326868';

    const BGP  = '#ffffff';
    const BGS  = '#F8F6F0';
    const TXP  = '#3A3A3A';
    const TXS  = '#666666';
    const TXT  = '#999999';
    const BDT  = '#E8E4DC';
    const BDS  = '#CCBCB0';
    const SUCC_BG  = '#EAF3DE';
    const SUCC_TX  = '#3B6D11';

    const qCurr = [
      { q: "Think about the last time you got close to booking a solo trip. What stopped you?", hint: "Be honest. There is no wrong answer here.", ph: "I stopped because..." },
      { q: "How would you describe yourself to someone who asked why you haven't traveled solo yet?", hint: "Say it the way you would actually say it. Not the polished version.", ph: "I'd probably say..." },
      { q: "Using those thoughts as a guide, complete this sentence:", em: "Right now, I am the woman who...", hint: "This is the one that gets saved to your roadmap. Make it yours.", ph: "...keeps dreaming about going but hasn't booked yet" }
    ];
    const qTow = [
      { q: "Imagine yourself after your first solo trip. You have just come home. How does she feel?", hint: "Take a moment with it before you write.", ph: "She feels..." },
      { q: "What is one thing that version of you does that you haven't done yet?", hint: "It doesn't have to be dramatic. It just has to be true.", ph: "She..." },
      { q: "Complete this sentence:", em: "I am becoming the woman who...", hint: "This is the one that gets saved to your roadmap. Make it yours.", ph: "...finally stops waiting and goes" }
    ];

    const IcoRight = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>;
    const IcoLeft  = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>;
    const IcoDl    = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IcoCheck = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12l5 6L20 6"/></svg>;

    function Hdr({ sup, title, dark }) {
      return (
        <div style={{ background: dark ? TD : T, borderRadius: '12px 12px 0 0', padding: '20px 24px' }}>
          <div style={{ fontSize: 11, fontWeight: 500, letterSpacing: '1.5px', textTransform: 'uppercase', color: G, marginBottom: 8 }}>{sup}</div>
          <h1 style={{ color: C, fontSize: 19, fontWeight: 500, margin: 0, lineHeight: 1.4 }}>{title}</h1>
        </div>
      );
    }

    function Crd({ children, onBack }) {
      return (
        <div style={{ background: BGP, border: `0.5px solid ${BDT}`, borderRadius: '0 0 12px 12px', padding: '24px' }}>
          {onBack && (
            <button onClick={onBack} style={{ background: '#FFFFFF', border: '1px solid rgba(212,165,116,0.55)', color: '#2C5F5D', fontSize: 13, fontWeight: 700, borderRadius: 999, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, padding: '9px 18px', marginBottom: 16, fontFamily: 'inherit', boxShadow: '0 8px 22px rgba(212,165,116,0.30)', transition: 'transform .2s, box-shadow .2s' }}>
              <IcoLeft size={13} /> Back
            </button>
          )}
          {children}
        </div>
      );
    }

    function BtnP({ onClick, disabled, children }) {
      return (
        <button onClick={onClick} disabled={disabled} style={{ background: disabled ? BGS : 'linear-gradient(to bottom, #37716E, #2C5F5D)', color: disabled ? TXT : C, border: disabled ? `0.5px solid ${BDT}` : 'none', borderRadius: 999, padding: '15px 26px', fontSize: 14, fontWeight: 700, cursor: disabled ? 'not-allowed' : 'pointer', width: '100%', marginTop: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, boxShadow: disabled ? 'none' : '0 8px 22px rgba(44,95,93,0.32)', transition: 'transform .2s, box-shadow .2s' }}>
          {children}
        </button>
      );
    }

    function BtnG({ onClick, children }) {
      return (
        <button onClick={onClick} style={{ background: 'linear-gradient(to bottom, #E0B98A, #D4A574)', color: '#142E2C', border: 'none', borderRadius: 999, padding: '15px 26px', fontSize: 14, fontWeight: 700, cursor: 'pointer', width: '100%', marginTop: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, boxShadow: '0 8px 22px rgba(212,165,116,0.45)', transition: 'transform .2s, box-shadow .2s' }}>
          {children}
        </button>
      );
    }

    function TA({ value, onChange, placeholder }) {
      return (
        <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
          style={{ width: '100%', minHeight: 96, padding: '10px 12px', fontSize: 14, border: `0.5px solid ${BDS}`, borderRadius: 12, background: '#FFFFFF', color: TXP, resize: 'vertical', boxShadow: 'inset 0 2px 4px rgba(44,95,93,0.07)', fontFamily: 'inherit', lineHeight: 1.7, boxSizing: 'border-box', marginTop: 8, display: 'block' }} />
      );
    }

    function NoteBox({ title, children }) {
      return (
        <div style={{ background: BGS, borderLeft: `3px solid ${G}`, padding: '12px 14px', marginBottom: 14 }}>
          {title && <div style={{ fontSize: 13, fontWeight: 500, color: TXP, marginBottom: 4 }}>{title}</div>}
          <div style={{ fontSize: 13, color: TXS, lineHeight: 1.7 }}>{children}</div>
        </div>
      );
    }

    function SavedBlk({ label, accent, prefix, value }) {
      return (
        <div style={{ background: BGS, borderLeft: `3px solid ${accent}`, padding: '14px 16px', marginBottom: 10 }}>
          <div style={{ fontSize: 11, fontWeight: 500, textTransform: 'uppercase', letterSpacing: '1.5px', color: accent === T ? T : '#b8884a', marginBottom: 8 }}>{label}</div>
          <p style={{ margin: 0, fontSize: 15, lineHeight: 1.7 }}>
            <span style={{ color: TXT, fontSize: 13 }}>{prefix} </span>
            <span style={{ fontWeight: 500 }}>{value}</span>
          </p>
        </div>
      );
    }

    function Dots({ n, total }) {
      return (
        <div style={{ display: 'flex', gap: 6, justifyContent: 'center', marginBottom: 20 }}>
          {Array.from({ length: total }).map((_, i) => (
            <div key={i} style={{ width: 7, height: 7, borderRadius: '50%', background: i < n ? G : i === n ? T : BDS, transition: 'background 0.2s' }} />
          ))}
        </div>
      );
    }

    function ChoiceCard({ title, desc, hovered, onHover, onLeave, onClick }) {
      return (
        <div onClick={onClick} onMouseEnter={onHover} onMouseLeave={onLeave}
          style={{ border: `1.5px solid ${hovered ? T : BDS}`, borderRadius: 14, boxShadow: '0 10px 30px rgba(44,95,93,0.09)', transition: 'transform .2s, box-shadow .2s', padding: '18px 20px', cursor: 'pointer', marginBottom: 12, background: hovered ? BGS : BGP, transition: 'border-color 0.15s, background 0.15s' }}>
          <div style={{ fontWeight: 500, fontSize: 15, marginBottom: 6, color: TXP }}>{title}</div>
          <div style={{ fontSize: 13, color: TXS, lineHeight: 1.6 }}>{desc}</div>
        </div>
      );
    }

    const bs = (mb=14) => ({ fontSize: 15, lineHeight: 1.8, color: TXS, marginBottom: mb });
    const hs = { fontSize: 12, color: TXT, marginTop: 6, lineHeight: 1.6, fontStyle: 'italic' };
    const ls = { fontSize: 11, fontWeight: 500, letterSpacing: '1.5px', textTransform: 'uppercase', color: T, display: 'block', marginBottom: 4 };
    const short = s => s.trim().length < 5;
    const w = { padding: '24px 0', maxWidth: 540, margin: '0 auto' };

    function App() {
      const [screen,  setScreen]  = useState('welcome');
      const [path,    setPath]    = useState(null);
      const [currId,  setCurrId]  = useState('');
      const [towId,   setTowId]   = useState('');
      const [step,    setStep]    = useState(0);
      const [tmp,     setTmp]     = useState('');
      const [guCurr,  setGuCurr]  = useState(['','','']);
      const [guTow,   setGuTow]   = useState(['','','']);
      const [hovCard, setHovCard] = useState(null);

      const saveGC = (s,v) => { const a=[...guCurr]; a[s]=v; setGuCurr(a); };
      const saveGT = (s,v) => { const a=[...guTow];  a[s]=v; setGuTow(a);  };
      const goToGC = (s)   => { setStep(s); setTmp(guCurr[s]||''); setScreen('guided-curr'); };
      const goToGT = (s)   => { setStep(s); setTmp(guTow[s] ||''); setScreen('guided-tow');  };

      const goBack = () => {
        switch(screen) {
          case 'intro':       setScreen('welcome'); break;
          case 'choice':      setScreen('intro');   break;
          case 'blank-curr':  setScreen('choice');  break;
          case 'blank-tow':   setScreen('blank-curr'); break;
          case 'guided-curr': saveGC(step,tmp); step===0 ? setScreen('choice') : goToGC(step-1); break;
          case 'guided-tow':  saveGT(step,tmp); step===0 ? goToGC(qCurr.length-1) : goToGT(step-1); break;
          case 'review':      path==='blank' ? setScreen('blank-tow') : goToGT(qTow.length-1); break;
          default: break;
        }
      };

      const doExport = () => {
        const d = { artifact:1, module:'module1_identity_trap', currentIdentity:currId, towardIdentity:towId, savedAt:new Date().toISOString() };
        const blob = new Blob([JSON.stringify(d,null,2)], {type:'application/json'});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a'); a.href=url; a.download='Fearless_Roadmap_Progress1.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        setScreen('done');
      };

      if (screen==='welcome') return (
        <div style={w}>
          <Hdr sup="Stop Chickening Out" title="Your Fearless First Trip Roadmap" />
          <Crd>
            <p style={bs()}>Throughout this course you are building something that belongs entirely to you.</p>
            <p style={bs()}>Not notes. Not a template someone else designed. Something built from your actual answers, your actual fears, your actual destination.</p>
            <p style={bs(20)}>Each lesson adds a new layer. By the time you reach the final lesson, it will be complete. You will know it when you see it.</p>
            <NoteBox title="How saving works">At the end of each session you save a small file. Next lesson you upload that file and pick up exactly where you left off. Any device. Any time.</NoteBox>
            <BtnP onClick={()=>setScreen('intro')}>I am ready to start building <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if (screen==='intro') return (
        <div style={w}>
          <Hdr sup="Module 1 — The Identity Trap" title="Layer 1: who you are right now" />
          <Crd onBack={goBack}>
            <p style={bs()}>This is the first layer of your roadmap.</p>
            <p style={bs()}>You are going to name two things. Who you are right now as a traveler. And who you are becoming.</p>
            <p style={bs(4)}>This is the foundation everything else gets built on. Take your time with it.</p>
            <BtnP onClick={()=>setScreen('choice')}>Let us go <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if (screen==='choice') return (
        <div style={w}>
          <Hdr sup="Layer 1" title="How would you like to work through this?" />
          <Crd onBack={goBack}>
            <p style={bs(20)}>Both paths arrive at the same place. Choose whichever feels right today.</p>
            <ChoiceCard title="Write freely" desc="I know what I want to say. Give me a blank space and I will write it myself."
              hovered={hovCard==='blank'} onHover={()=>setHovCard('blank')} onLeave={()=>setHovCard(null)}
              onClick={()=>{ setPath('blank'); setScreen('blank-curr'); }} />
            <ChoiceCard title="Guide me through it" desc="I will answer a few short questions and arrive at my own words. The questions disappear when I am done."
              hovered={hovCard==='guided'} onHover={()=>setHovCard('guided')} onLeave={()=>setHovCard(null)}
              onClick={()=>{ setPath('guided'); goToGC(0); }} />
          </Crd>
        </div>
      );

      if (screen==='blank-curr') return (
        <div style={w}>
          <Hdr sup="Part 1 of 2" title="Who you are right now" />
          <Crd onBack={goBack}>
            <p style={bs()}>Be honest. The truest version usually comes first.</p>
            <label style={ls}>Right now, I am the woman who...</label>
            <TA value={currId} onChange={setCurrId} placeholder="...keeps dreaming about going but hasn't booked yet" />
            <p style={hs}>Write it the way you would actually say it. Not the polished version.</p>
            <BtnP onClick={()=>setScreen('blank-tow')} disabled={short(currId)}>Continue to part 2 <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if (screen==='blank-tow') return (
        <div style={w}>
          <Hdr sup="Part 2 of 2" title="Who you are becoming" />
          <Crd onBack={goBack}>
            <p style={bs()}>Not who you think you should be. Who you actually want to become.</p>
            <label style={ls}>I am becoming the woman who...</label>
            <TA value={towId} onChange={setTowId} placeholder="...finally stops waiting and goes" />
            <p style={hs}>This does not have to be perfect. It just has to be true.</p>
            <BtnP onClick={()=>setScreen('review')} disabled={short(towId)}>See what I just built <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if (screen==='guided-curr') {
        const q=qCurr[step]; const last=step===qCurr.length-1;
        return (
          <div style={w}>
            <Hdr sup="Who you are right now" title={last?'One more thing':`Question ${step+1} of ${qCurr.length}`} />
            <Crd onBack={goBack}>
              <Dots n={step} total={qCurr.length} />
              <p style={{...bs(), fontWeight:500, color:TXP}}>{q.q}</p>
              {q.em && <p style={{fontSize:15,fontWeight:500,color:T,margin:'0 0 8px',padding:'10px 12px',background:BGS,borderRadius:8}}>{q.em}</p>}
              <TA value={tmp} onChange={setTmp} placeholder={q.ph} />
              <p style={hs}>{q.hint}</p>
              <BtnP disabled={short(tmp)} onClick={()=>{ saveGC(step,tmp); if(last){setCurrId(tmp);goToGT(0);}else{setStep(step+1);setTmp(guCurr[step+1]||'');} }}>
                {last?'Continue to part 2':'Next'} <IcoRight size={15}/>
              </BtnP>
            </Crd>
          </div>
        );
      }

      if (screen==='guided-tow') {
        const q=qTow[step]; const last=step===qTow.length-1;
        return (
          <div style={w}>
            <Hdr sup="Who you are becoming" title={last?'Almost there':`Question ${step+1} of ${qTow.length}`} />
            <Crd onBack={goBack}>
              <Dots n={step} total={qTow.length} />
              <p style={{...bs(), fontWeight:500, color:TXP}}>{q.q}</p>
              {q.em && <p style={{fontSize:15,fontWeight:500,color:T,margin:'0 0 8px',padding:'10px 12px',background:BGS,borderRadius:8}}>{q.em}</p>}
              <TA value={tmp} onChange={setTmp} placeholder={q.ph} />
              <p style={hs}>{q.hint}</p>
              <BtnP disabled={short(tmp)} onClick={()=>{ saveGT(step,tmp); if(last){setTowId(tmp);setScreen('review');}else{setStep(step+1);setTmp(guTow[step+1]||'');} }}>
                {last?'See what I just built':'Next'} <IcoRight size={15}/>
              </BtnP>
            </Crd>
          </div>
        );
      }

      if (screen==='review') return (
        <div style={w}>
          <Hdr sup="Layer 1 complete" title="This is yours" />
          <Crd onBack={goBack}>
            <p style={bs(20)}>Read it back. Take a moment with it. This is the foundation your roadmap gets built on.</p>
            <SavedBlk label="Right now" accent={T} prefix="I am the woman who" value={currId} />
            <SavedBlk label="Becoming" accent={G} prefix="I am becoming the woman who" value={towId} />
            <p style={{fontSize:14,lineHeight:1.7,color:TXS,marginTop:16,marginBottom:0}}>Save your progress before you continue. You will be asked to upload this file in the next step.</p>
            <BtnG onClick={doExport}><IcoDl size={15}/> Save my progress — Fearless_Roadmap_Progress1.json</BtnG>
          </Crd>
        </div>
      );

      if (screen==='done') return (
        <div style={w}>
          <Hdr dark sup="Progress saved" title="Layer 1 is in your roadmap" />
          <Crd>
            <div style={{background:SUCC_BG,borderRadius:8,padding:'12px 14px',marginBottom:16,display:'flex',gap:10,alignItems:'flex-start'}}>
              <IcoCheck size={16} style={{color:SUCC_TX,marginTop:2,flexShrink:0}}/>
              <div>
                <div style={{fontSize:13,fontWeight:500,color:SUCC_TX,marginBottom:3}}>Fearless_Roadmap_Progress1.json saved</div>
                <div style={{fontSize:13,color:TXS,lineHeight:1.6}}>Keep this file somewhere you will find it. When the next step arrives in the course, you will be asked to upload it.</div>
              </div>
            </div>
            <NoteBox title="Keep your file safe">Your progress is saved in Fearless_Roadmap_Progress1.json. When the next step arrives later in the course, you will be asked to upload it to continue building.</NoteBox>
            <a href={LINK}>
              <BtnP>Continue in the course <IcoRight size={15}/></BtnP>
            </a>
          </Crd>
        </div>
      );

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
