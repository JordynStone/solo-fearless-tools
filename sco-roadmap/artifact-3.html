<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fearless First Trip Roadmap — Layer 3</title>
  <!-- Go's decision, 2 August 2026: the tools stay out of search. They are things her members open from a lesson, not pages to be found. Crawling is deliberately left allowed, because a blocked page cannot be read and so cannot be told to stay out. -->
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="../vendor/react.production.min.js" crossorigin></script>
  <script src="../vendor/react-dom.production.min.js" crossorigin></script>
  <script src="../vendor/babel.min.js"></script>
<link rel="stylesheet" href="/fonts/montserrat.css">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', system-ui, -apple-system, sans-serif; background:
        radial-gradient(520px 320px at 8% 4%, rgba(212,165,116,0.20), rgba(212,165,116,0) 70%),
        radial-gradient(460px 300px at 94% 12%, rgba(232,168,124,0.18), rgba(232,168,124,0) 70%),
        radial-gradient(600px 360px at 50% 104%, rgba(44,95,93,0.10), rgba(44,95,93,0) 72%),
        #F8F6F0;
      background-attachment: fixed; min-height: 100vh; padding: 16px; color: #3A3A3A; }
    textarea:focus, input:focus { border-color: #D4A574 !important; outline: none; box-shadow: inset 0 2px 4px rgba(44,95,93,0.07), 0 0 0 3px rgba(212,165,116,0.18); }
    a { text-decoration: none; }
      button:not(:disabled):hover, label[style*='cursor']:hover { transform: translateY(-2px); }
    button:not(:disabled):active, label[style*='cursor']:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const T='#2C5F5D',TD='#1e4442',G='#D4A574',C='#F8F6F0',COR='#E8A87C';
    const BGP='#ffffff',BGS='#F8F6F0',TXP='#3A3A3A',TXS='#666666',TXT='#999999';
    const BDT='#E8E4DC',BDS='#CCBCB0',SUCC_BG='#EAF3DE',SUCC_TX='#3B6D11';
    const NEXT='https://members.soloandfearless.com/classroom/2b6f5b1b-e1b7-47c1-81a0-1f9ff2886f0c/63f78ff0-b60d-4e07-b8b9-dfdce4861b22';

    const FC={ green:T, yellow:'#b8884a', red:'#a05010' };
    const FL={ green:'Well-suited', yellow:'Worth noting', red:'Might be a stretch' };

    const FACTORS=[
      {
        id:'distance',screen:'f1',
        sup:'Factor 1 of 6 — Distance',label:'Distance from home',
        q:'How does getting to this destination feel?',
        opts:[
          {id:'green',label:'Within 4 hours by flight or train',desc:'Close enough that home feels reachable if I need it.'},
          {id:'yellow',label:'5 to 8 hours of travel',desc:'A bit further, but still manageable for a first trip.'},
          {id:'red',label:'Long-haul, 9 hours or more',desc:'Far from home — a bigger first-trip commitment.'}
        ]
      },
      {
        id:'language',screen:'f2',
        sup:'Factor 2 of 6 — Language',label:'Language',
        q:'How comfortable are you with the language spoken there?',
        opts:[
          {id:'green',label:'I speak it, or English is widely available',desc:'Communication feels accessible and manageable.'},
          {id:'yellow',label:'I do not speak it, but basics and gestures would get me through',desc:'A stretch, but navigable with some effort.'},
          {id:'red',label:'I do not speak it and English is limited',desc:'A real communication challenge for a first trip.'}
        ]
      },
      {
        id:'culture',screen:'f3',
        sup:'Factor 3 of 6 — Culture',label:'Cultural familiarity',
        q:'How familiar is the local culture and way of life?',
        opts:[
          {id:'green',label:'Similar to what I know — customs and social norms feel familiar',desc:'The cultural adjustment feels small.'},
          {id:'yellow',label:'Some differences, but nothing that would feel overwhelming',desc:'Different enough to be interesting, familiar enough to manage.'},
          {id:'red',label:'Very different from what I know',desc:'A significant cultural adjustment for a first trip.'}
        ]
      },
      {
        id:'infrastructure',screen:'f4',
        sup:'Factor 4 of 6 — Tourism Infrastructure',label:'Tourism infrastructure',
        q:'How established is visitor support in this destination?',
        opts:[
          {id:'green',label:'Very popular tourist destination',desc:'Well-established support and services for visitors.'},
          {id:'yellow',label:'Growing tourist scene',desc:'Some infrastructure in place, but some gaps.'},
          {id:'red',label:'Off the beaten path',desc:'Limited visitor support and infrastructure.'}
        ]
      },
      {
        id:'duration',screen:'f5',
        sup:'Factor 5 of 6 — Duration',label:'Planned duration',
        q:'How long are you planning to stay?',
        opts:[
          {id:'green',label:'2 to 4 days',desc:'Short enough to feel manageable. Long enough to matter.'},
          {id:'yellow',label:'5 to 7 days',desc:'A full week away alone — a real commitment.'},
          {id:'red',label:'8 days or more',desc:'A longer first trip — a bigger initial stretch.'}
        ]
      },
      {
        id:'accommodation',screen:'f6',
        sup:'Factor 6 of 6 — Accommodation',label:'Accommodation type',
        q:'What type of accommodation are you considering?',
        opts:[
          {id:'green',label:'Hotel or guesthouse with a front desk',desc:'Someone available to help if something comes up.'},
          {id:'yellow',label:'Apartment or Airbnb in a central, accessible area',desc:'Self-sufficient but in a safe and central location.'},
          {id:'red',label:'Remote or isolated accommodation',desc:'Limited staff or support on hand.'}
        ]
      }
    ];

    const IcoUp    = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
    const IcoRight = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>;
    const IcoLeft  = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>;
    const IcoDl    = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
    const IcoCheck = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12l5 6L20 6"/></svg>;
    const IcoReset = ({size=13}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>;

    function Hdr({sup,title,dark}) {
      return <div style={{background:dark?TD:T,borderRadius:'12px 12px 0 0',padding:'20px 24px'}}>
        <div style={{fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:G,marginBottom:8}}>{sup}</div>
        <h1 style={{color:C,fontSize:19,fontWeight:500,margin:0,lineHeight:1.4}}>{title}</h1>
      </div>;
    }
    function Crd({children,onBack}) {
      return <div style={{background:BGP,border:`0.5px solid ${BDT}`,borderRadius:'0 0 12px 12px',padding:'24px'}}>
        {onBack && <button onClick={onBack} style={{background:'#FFFFFF',border:'1px solid rgba(212,165,116,0.55)',color:'#2C5F5D',fontSize:13,fontWeight:700,borderRadius:999,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6,padding:'9px 18px',marginBottom:16,fontFamily:'inherit',boxShadow:'0 8px 22px rgba(212,165,116,0.30)',transition:'transform .2s, box-shadow .2s'}}><IcoLeft size={13}/> Back</button>}
        {children}
      </div>;
    }
    function BtnP({onClick,disabled,children}) {
      return <button onClick={onClick} disabled={disabled} style={{background:disabled?BGS:'linear-gradient(to bottom, #37716E, #2C5F5D)',color:disabled?TXT:C,border:disabled?`0.5px solid ${BDT}`:'none',borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:disabled?'not-allowed':'pointer',width:'100%',marginTop:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:disabled?'none':'0 8px 22px rgba(44,95,93,0.32)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
    }
    function BtnG({onClick,children}) {
      return <button onClick={onClick} style={{background:'linear-gradient(to bottom, #E0B98A, #D4A574)',color:'#142E2C',border:'none',borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:'pointer',width:'100%',marginTop:16,display:'flex',alignItems:'center',justifyContent:'center',gap:8,boxShadow:'0 8px 22px rgba(212,165,116,0.45)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
    }
    function BtnSec({onClick,children}) {
      return <button onClick={onClick} style={{background:'#FFFFFF',color:'#2C5F5D',border:'1px solid rgba(212,165,116,0.55)',borderRadius:999,padding:'12px 22px',fontSize:13,fontWeight:700,cursor:'pointer',width:'100%',marginTop:10,display:'flex',alignItems:'center',justifyContent:'center',gap:6,boxShadow:'0 8px 22px rgba(212,165,116,0.30)',transition:'transform .2s, box-shadow .2s'}}>{children}</button>;
    }
    function NoteBox({title,children,accent}) {
      return <div style={{background:BGS,borderLeft:`3px solid ${accent||G}`,padding:'12px 14px',marginBottom:14}}>
        {title && <div style={{fontSize:13,fontWeight:500,color:TXP,marginBottom:4}}>{title}</div>}
        <div style={{fontSize:13,color:TXS,lineHeight:1.7}}>{children}</div>
      </div>;
    }
    function SavedBlk({label,accent,prefix,value}) {
      return <div style={{background:BGS,borderLeft:`3px solid ${accent}`,padding:'14px 16px',marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:500,textTransform:'uppercase',letterSpacing:'1.5px',color:accent===T?T:accent===G?'#b8884a':'#a05010',marginBottom:8}}>{label}</div>
        <p style={{margin:0,fontSize:15,lineHeight:1.7}}>
          {prefix && <span style={{color:TXT,fontSize:13}}>{prefix} </span>}
          <span style={{fontWeight:500}}>{value}</span>
        </p>
      </div>;
    }
    function DestTag({children}) {
      return <div style={{background:BGS,border:`0.5px solid ${BDS}`,borderRadius:8,padding:'10px 14px',margin:'0 0 16px'}}>
        <div style={{fontSize:11,fontWeight:500,textTransform:'uppercase',letterSpacing:'1.5px',color:TXS,marginBottom:4}}>Your destination</div>
        <div style={{fontSize:15,fontWeight:500,lineHeight:1.5,color:TXP}}>{children}</div>
      </div>;
    }
    function FactorRow({label,value}) {
      return <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 0',borderBottom:`0.5px solid ${BDT}`}}>
        <span style={{fontSize:14,color:TXP}}>{label}</span>
        <span style={{fontSize:12,fontWeight:500,color:FC[value]}}>{FL[value]}</span>
      </div>;
    }
    function QCard({option,onClick}) {
      const [hov,setHov]=useState(false);
      return <div onClick={()=>onClick(option.id)} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{border:`1.5px solid ${hov?T:BDS}`,borderRadius:14,padding:'14px 16px',cursor:'pointer',marginBottom:10,background:hov?BGS:BGP,boxShadow:'0 10px 30px rgba(44,95,93,0.09)',transition:'border-color 0.15s, background 0.15s, transform .2s, box-shadow .2s'}}>
        <div style={{fontWeight:500,fontSize:14,marginBottom:4,color:TXP}}>{option.label}</div>
        <div style={{fontSize:12,color:TXS,lineHeight:1.6}}>{option.desc}</div>
      </div>;
    }
    function Dots({n,total}) {
      return <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:20}}>
        {Array.from({length:total}).map((_,i)=>(
          <div key={i} style={{width:7,height:7,borderRadius:'50%',background:i<n?G:i===n?T:BDS,transition:'background 0.2s'}}/>
        ))}
      </div>;
    }

    const bs=(mb=14)=>({fontSize:15,lineHeight:1.8,color:TXS,marginBottom:mb});
    const hs={fontSize:12,color:TXT,marginTop:6,lineHeight:1.6,fontStyle:'italic'};
    const ls={fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:T,display:'block',marginBottom:4};
    const short=s=>s.trim().length<3;
    const w={padding:'24px 0',maxWidth:540,margin:'0 auto'};

    const INIT_FACTORS={distance:null,language:null,culture:null,infrastructure:null,duration:null,accommodation:null};

    function App() {
      const [screen,setScreen]=useState('import');
      const [p2,setP2]=useState(null);
      const [importErr,setImportErr]=useState(false);
      const [dest,setDest]=useState('');
      const [factors,setFactors]=useState(INIT_FACTORS);

      const setFactor=(id,val)=>setFactors(prev=>({...prev,[id]:val}));
      const greens=()=>Object.values(factors).filter(v=>v==='green').length;
      const guidance=()=>{ const g=greens(); return g>=5?'strong':g>=3?'moderate':'challenging'; };

      const goBack=()=>{
        const fIdx=FACTORS.findIndex(f=>f.screen===screen);
        if(fIdx!==-1){ setScreen(fIdx===0?'name-dest':FACTORS[fIdx-1].screen); return; }
        switch(screen){
          case 'welcome-back': setScreen('import'); break;
          case 'name-dest': setScreen('welcome-back'); break;
          case 'formula-result': setScreen(FACTORS[FACTORS.length-1].screen); break;
          case 'review': setScreen('formula-result'); break;
          default: break;
        }
      };

      const resetAndRetry=()=>{ setDest(''); setFactors(INIT_FACTORS); setScreen('name-dest'); };

      const handleImport=(e)=>{
        const file=e.target.files[0]; if(!file) return;
        setImportErr(false);
        const reader=new FileReader();
        reader.onload=(evt)=>{
          try{
            const d=JSON.parse(evt.target.result);
            if(!d.currentIdentity||!d.towardIdentity) throw new Error();
            setP2(d); setScreen('welcome-back');
          } catch{setImportErr(true);}
        };
        reader.readAsText(file);
      };

      const doExport=()=>{
        const d={artifact:3,module:'module3_safety_net_formula',currentIdentity:p2.currentIdentity,towardIdentity:p2.towardIdentity,specificFear:p2.specificFear||null,fearClassification:p2.fearClassification||null,destination:dest,formulaFactors:factors,formulaGuidance:guidance(),savedAt:new Date().toISOString()};
        const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download='Fearless_Roadmap_Progress3.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        setScreen('done');
      };

      // Factor screens
      const currentFactor=FACTORS.find(f=>f.screen===screen);
      if(currentFactor) {
        const fIdx=FACTORS.indexOf(currentFactor);
        return (
          <div style={w}>
            <Hdr sup={currentFactor.sup} title={currentFactor.q}/>
            <Crd onBack={goBack}>
              <Dots n={fIdx} total={FACTORS.length}/>
              <DestTag>{dest}</DestTag>
              {currentFactor.opts.map(o=>(
                <QCard key={o.id} option={o} onClick={(ans)=>{
                  setFactor(currentFactor.id,ans);
                  setScreen(fIdx===FACTORS.length-1?'formula-result':FACTORS[fIdx+1].screen);
                }}/>
              ))}
            </Crd>
          </div>
        );
      }

      if(screen==='import') return (
        <div style={w}>
          <Hdr sup="Stop Chickening Out — Module 3" title="Picking your first destination"/>
          <Crd>
            <p style={bs()}>Module 3 is about choosing a destination that sets you up to actually go. In this session you will run your destination through the Safety Net Trip Formula — six factors that tell you whether your choice is right for where you are right now.</p>
            <p style={bs(20)}>Upload your saved file from the previous session to continue building your roadmap.</p>
            <label style={{display:'block',background:'linear-gradient(to bottom, #37716E, #2C5F5D)',color:C,borderRadius:999,padding:'15px 26px',fontSize:14,fontWeight:700,cursor:'pointer',textAlign:'center',marginBottom:importErr?8:0,boxShadow:'0 8px 22px rgba(44,95,93,0.32)',transition:'transform .2s, box-shadow .2s'}}>
              <input type="file" accept=".json" onChange={handleImport} style={{display:'none'}}/>
              <span style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8}}><IcoUp size={15}/> Upload Fearless_Roadmap_Progress2.json</span>
            </label>
            {importErr && <p style={{fontSize:13,color:'#c0392b',marginTop:8,lineHeight:1.6}}>That does not look like the right file. Make sure you are uploading Fearless_Roadmap_Progress2.json from the previous session.</p>}
            <p style={{...hs,marginTop:16}}>No file yet? Complete the Module 2 session first. Your file will be named Fearless_Roadmap_Progress2.json.</p>
          </Crd>
        </div>
      );

      if(screen==='welcome-back') return (
        <div style={w}>
          <Hdr sup="Module 3 — Lesson 2" title="Welcome back"/>
          <Crd onBack={goBack}>
            <p style={bs()}>Your roadmap so far.</p>
            <SavedBlk label="Right now" accent={T} prefix="I am the woman who" value={p2.currentIdentity}/>
            <SavedBlk label="Becoming" accent={G} prefix="I am becoming the woman who" value={p2.towardIdentity}/>
            {p2.specificFear && <SavedBlk label="Named fear" accent={COR} value={p2.specificFear}/>}
            <p style={{...bs(4),marginTop:8}}>In this session you will name the destination you have been considering and run it through six factors that show whether it is the right choice for a first solo trip.</p>
            <p style={bs(4)}>There are no wrong answers here. The formula is a tool, not a verdict.</p>
            <BtnP onClick={()=>setScreen('name-dest')}>Let us look at your destination <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if(screen==='name-dest') return (
        <div style={w}>
          <Hdr sup="Layer 3 — Destination" title="Where are you thinking of going?"/>
          <Crd onBack={goBack}>
            <p style={bs()}>Not the dream destination necessarily. The one that has been in your head as a real possibility for your first solo trip.</p>
            <label style={ls}>I am thinking about going to...</label>
            <input type="text" value={dest} onChange={e=>setDest(e.target.value)}
              placeholder="e.g. Düsseldorf, Antwerp, Lisbon, Istanbul"
              style={{width:'100%',padding:'11px 14px',fontSize:14,border:`1px solid rgba(44,95,93,0.2)`,borderRadius:12,background:'#FFFFFF',color:TXP,fontFamily:'inherit',lineHeight:1.7,boxSizing:'border-box',marginTop:8,outline:'none',display:'block',boxShadow:'inset 0 2px 4px rgba(44,95,93,0.07)'}}/>
            <p style={hs}>Write the destination you actually have in mind, not the one that sounds best. This is for you.</p>
            <BtnP disabled={short(dest)} onClick={()=>setScreen('f1')}>Run it through the formula <IcoRight size={15}/></BtnP>
          </Crd>
        </div>
      );

      if(screen==='formula-result') {
        const g=guidance();
        const titles={ strong:'This destination looks right', moderate:'This destination could work', challenging:'Worth reconsidering for a first trip' };
        const texts={
          strong:'The formula confirms what you might already feel. The conditions here give you the best possible chance of going and coming home knowing you can do it again. This is how first trips are supposed to be chosen.',
          moderate:'This destination has some factors worth going in aware of. It can absolutely work as a first trip. The factors marked "worth noting" are not reasons not to go — they are things to prepare for. The next lessons show you how.',
          challenging:'Based on the formula, this destination might work better as a second or third trip, once you have a first booking under your belt. That is not a reason not to want it. It is a reason to build toward it. A different first destination gets you there faster than no trip at all.'
        };
        return (
          <div style={w}>
            <Hdr sup="Safety Net Trip Formula — Result" title={titles[g]}/>
            <Crd onBack={goBack}>
              <DestTag>{dest}</DestTag>
              <div style={{marginBottom:16}}>
                {FACTORS.map(f=><FactorRow key={f.id} label={f.label} value={factors[f.id]}/>)}
              </div>
              <p style={bs(20)}>{texts[g]}</p>
              <BtnP onClick={()=>setScreen('review')}>Save this destination to my roadmap <IcoRight size={15}/></BtnP>
              <BtnSec onClick={resetAndRetry}><IcoReset/> Try a different destination</BtnSec>
            </Crd>
          </div>
        );
      }

      if(screen==='review') return (
        <div style={w}>
          <Hdr sup="Layer 3 complete" title="Your roadmap is taking shape"/>
          <Crd onBack={goBack}>
            <p style={bs(20)}>Everything you have built so far. Read it as a whole.</p>
            <SavedBlk label="Right now" accent={T} prefix="I am the woman who" value={p2.currentIdentity}/>
            <SavedBlk label="Becoming" accent={G} prefix="I am becoming the woman who" value={p2.towardIdentity}/>
            {p2.specificFear && <SavedBlk label="Named fear" accent={COR} value={p2.specificFear}/>}
            {p2.fearClassification && <SavedBlk label="Fear classification" accent={p2.fearClassification==='real'?T:p2.fearClassification==='unsure'?G:COR}
              value={p2.fearClassification==='real'?'Real concern — research tools coming in the next lessons':p2.fearClassification==='unsure'?'Complex — working through it as the course continues':'Fear wearing a costume — a pattern to name, not a problem to solve'}/>}
            <SavedBlk label="My destination" accent={T} value={dest}/>
            <SavedBlk label="Formula result" accent={guidance()==='strong'?T:guidance()==='moderate'?G:COR}
              value={guidance()==='strong'?'Well-suited for a first solo trip':guidance()==='moderate'?'Could work — going in prepared makes the difference':'Building toward this — a different first destination gets you there faster'}/>
            <p style={{fontSize:14,lineHeight:1.7,color:TXS,marginTop:16,marginBottom:0}}>Save your progress before you continue.</p>
            <BtnG onClick={doExport}><IcoDl size={15}/> Save my progress — Fearless_Roadmap_Progress3.json</BtnG>
          </Crd>
        </div>
      );

      if(screen==='done') return (
        <div style={w}>
          <Hdr dark sup="Progress saved" title="Layer 3 is in your roadmap"/>
          <Crd>
            <div style={{background:SUCC_BG,borderRadius:8,padding:'12px 14px',marginBottom:16,display:'flex',gap:10,alignItems:'flex-start'}}>
              <IcoCheck size={16} style={{color:SUCC_TX,marginTop:2,flexShrink:0}}/>
              <div>
                <div style={{fontSize:13,fontWeight:500,color:SUCC_TX,marginBottom:3}}>Fearless_Roadmap_Progress3.json saved</div>
                <div style={{fontSize:13,color:TXS,lineHeight:1.6}}>Keep this file. You will need it for the next exercise later in the course.</div>
              </div>
            </div>
            <NoteBox title="Keep your file safe">Your progress is saved in Fearless_Roadmap_Progress3.json. When the next exercise moment arrives, you will be asked to upload it to continue building.</NoteBox>
            <a href={NEXT}>
              <BtnP>Continue in the course <IcoRight size={15}/></BtnP>
            </a>
          </Crd>
        </div>
      );

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
